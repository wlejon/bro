<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: Consolas, monospace;
    overflow: hidden;
}

/* The canvas does everything: matrix glyphs in the revealed region, solid
   dark curtain in the covered region, and a 100px feather between them.
   No CSS masks — the layout engine doesn't support them. Text overlays are
   DOM divs that sit on top of the canvas. */
#stage {
    position: absolute;
    top: 0;
    left: 0;
    /* width/height are set to the viewport size by JS — CSS `height: 100%`
       doesn't resolve on this replaced element (canvas) in the layout
       engine, so we size it explicitly in pixels. */
}

#wordmark {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    margin-top: -72px;
    text-align: center;
    font-size: 112px;
    font-weight: bold;
    letter-spacing: 10px;
    color: #7cff5c;
    text-shadow:
        0 0 8px #7cff5c,
        0 0 22px #3fa832,
        0 0 40px #1e5a18;
    pointer-events: none;
}

#cursor {
    display: inline-block;
    color: #7cff5c;
    margin-left: 6px;
}

#tagline {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    margin-top: 70px;
    text-align: center;
    font-size: 14px;
    letter-spacing: 6px;
    color: #3fa832;
    opacity: 0.7;
    pointer-events: none;
}

#dots {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    margin-top: 96px;
    text-align: center;
    font-size: 22px;
    color: #7cff5c;
    text-shadow: 0 0 8px #7cff5c;
    pointer-events: none;
}

#dots .d {
    display: inline-block;
    width: 18px;
    text-align: center;
    opacity: 0.12;
}

#dots .d.on { opacity: 1; }

/* Crisp leading edge of the scan beam — DOM so we get the box-shadow glow
   without painting blur manually on the canvas. */
#scan {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    top: -4px;
    pointer-events: none;
    background: rgba(180, 255, 150, 0.95);
    box-shadow: 0 0 14px rgba(124, 255, 92, 0.95),
                0 0 28px rgba(124, 255, 92, 0.55);
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="wordmark">_bro<span id="cursor">|</span></div>
<div id="tagline">LOADING</div>
<div id="dots"><span class="d" id="d0">.</span><span class="d" id="d1">.</span><span class="d" id="d2">.</span></div>
<div id="scan"></div>

<script>
(function() {
    var stage = document.getElementById('stage');
    var wordmark = document.getElementById('wordmark');
    var cursor = document.getElementById('cursor');
    var scan = document.getElementById('scan');
    var tagline = document.getElementById('tagline');
    var dots = document.getElementById('dots');
    var dotSpans = [
        document.getElementById('d0'),
        document.getElementById('d1'),
        document.getElementById('d2')
    ];

    var ctx = stage.getContext('2d');
    var lastVW = 0, lastVH = 0;

    // Matrix-ish columns: each column drips bright "cells" at its own speed
    // with a bright head and a fading tail. Stylization only.
    // (Using fillRect cells rather than glyphs — canvas text rendering in
    // system panels isn't wired up, and the rect look ended up cleaner.)
    var COL_W = 16;
    var ROW_H = 16;
    var columns = [];

    function ensureColumns(vw, vh) {
        stage.width = vw;
        stage.height = vh;
        // Explicit CSS size — see note in #stage about percent heights.
        stage.style.width = vw + 'px';
        stage.style.height = vh + 'px';
        var n = Math.ceil(vw / COL_W) + 1;
        columns.length = 0;
        for (var i = 0; i < n; i++) {
            columns.push({
                y: Math.random() * vh,
                speed: 40 + Math.random() * 110,       // px/sec
                len: 8 + Math.floor(Math.random() * 22)
            });
        }
    }

    // Every frame: (1) trail-fade everything toward dark, (2) paint fresh
    // matrix glyphs, (3) paint the feathered curtain over the bottom portion
    // so glyphs below the scan line are hidden. Everything happens on one
    // canvas; no CSS masks needed.
    function drawFrame(dt, vw, vh, scanBottom) {
        // Trail fade — translucent dark over the full canvas. Accumulates
        // over frames to fade old glyph tails and keeps the background
        // solid dark where no glyph is drawn (prevents the app leaking).
        ctx.fillStyle = 'rgba(5, 10, 7, 0.22)';
        ctx.fillRect(0, 0, vw, vh);

        // Matrix columns — painted over everything; the feathered curtain
        // below will hide the rows in the covered region.
        for (var i = 0; i < columns.length; i++) {
            var c = columns[i];
            c.y += c.speed * dt;
            if (c.y - c.len * ROW_H > vh) {
                c.y = -Math.random() * 200;
                c.speed = 40 + Math.random() * 110;
                c.len = 8 + Math.floor(Math.random() * 22);
            }
            var x = i * COL_W;
            for (var j = 0; j < c.len; j++) {
                var gy = c.y - j * ROW_H;
                if (gy < -ROW_H || gy > vh) continue;
                if (j === 0) {
                    ctx.fillStyle = 'rgba(210, 255, 195, 0.95)';
                } else {
                    var a = (1 - j / c.len) * 0.75;
                    ctx.fillStyle = 'rgba(124, 255, 92, ' + a.toFixed(3) + ')';
                }
                ctx.fillRect(x, gy, 10, 12);
            }
        }

        // Feathered curtain: solid dark below the scan line, fading up to
        // transparent over a 100px band above it. No gradient API is wired
        // on this canvas binding, so paint a stack of 1px strips with
        // stepping alpha. At scan line alpha=1 → matrix fully hidden.
        var FEATHER = 100;
        var fadeTop = scanBottom - FEATHER;
        for (var s = 0; s < FEATHER; s++) {
            var y = fadeTop + s;
            if (y < 0) continue;
            if (y >= vh) break;
            var aa = (s + 1) / FEATHER;
            ctx.fillStyle = 'rgba(5, 10, 7, ' + aa.toFixed(3) + ')';
            ctx.fillRect(0, y, vw, 1);
        }
        if (scanBottom < vh) {
            ctx.fillStyle = '#050a07';
            var top = Math.max(0, scanBottom);
            ctx.fillRect(0, top, vw, vh - top);
        }
    }

    // rAF timestamp is the engine clock (real time windowed, virtual time
    // headless) — use it so `advanceTime()` drives the animation correctly.
    var t0 = -1;
    var tPrev = -1;
    var dismissAt = 0;
    var DISMISS_MS = 500;
    var TEXT_FADE_MS = 250;
    var BG_FADE_DELAY_MS = 125;
    var BG_FADE_MS = 375;

    window.__onDismiss = function() {
        dismissAt = -1;   // stamp on next rAF which has the engine clock
    };

    function frame(now) {
        if (t0 < 0) { t0 = now; tPrev = now; }
        if (dismissAt === -1) dismissAt = now;
        var t = (now - t0) / 1000;
        var dt = Math.min(0.05, (now - tPrev) / 1000);
        tPrev = now;

        var vp = { width: 1920, height: 1080 };
        var vw = vp.width, vh = vp.height;
        if (vw !== lastVW || vh !== lastVH) {
            lastVW = vw; lastVH = vh;
            ensureColumns(vw, vh);
        }

        // Pre-dismiss: scan line sweeps continuously at a slow, idle pace.
        // Dismiss: scan briefly pulls up, then accelerates past the bottom.
        // scanBottom is the leading edge of the reveal; the feather extends
        // 100 pixels above it.
        var scanBottom;
        var textOp = 1;
        var stageOp = 1;

        // Idle: scan sweeps once from above the viewport to the bottom over
        // IDLE_MS, so by the time the engine fires __onDismiss the matrix is
        // fully revealed. Engine's kMinDisplayMs is tuned to match.
        var IDLE_MS = 1800;
        var idlePos = Math.min(1, (now - t0) / IDLE_MS);
        var idleScanBottom = -80 + idlePos * (vh + 120);

        if (dismissAt > 0) {
            // No more scan reveal on dismiss — just hold the beam where idle
            // left it and fade the text, then the background.
            scanBottom = idleScanBottom;
            var dms = now - dismissAt;
            textOp = 1 - Math.max(0, Math.min(1, dms / TEXT_FADE_MS));
            stageOp = 1 - Math.max(0, Math.min(1, (dms - BG_FADE_DELAY_MS) / BG_FADE_MS));

            if (dms >= DISMISS_MS) {
                if (typeof __bro !== 'undefined' && __bro.splash && __bro.splash.dismiss) {
                    __bro.splash.dismiss();
                }
                return;
            }
        } else {
            scanBottom = idleScanBottom;
        }

        drawFrame(dt, vw, vh, scanBottom);
        stage.style.opacity = stageOp.toFixed(3);
        scan.style.top = (scanBottom - 1).toFixed(1) + 'px';
        scan.style.opacity = stageOp.toFixed(3);

        if (dismissAt <= 0) {
            cursor.style.opacity = (Math.floor(t * 2) % 2 === 0) ? '1' : '0';
            var pulse = 0.85 + 0.15 * (0.5 + 0.5 * Math.sin(t * 4.2));
            wordmark.style.opacity = pulse.toFixed(3);
            var step = Math.floor(t * 4) % 4;
            for (var i = 0; i < 3; i++) {
                dotSpans[i].className = (step > i) ? 'd on' : 'd';
            }
        } else {
            wordmark.style.opacity = textOp.toFixed(3);
            tagline.style.opacity = (textOp * 0.7).toFixed(3);
            dots.style.opacity = (textOp * 0.85).toFixed(3);
        }

        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
