<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #e0e0e0;
}

#nav-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 28px;
    background: rgba(0, 0, 0, 230);
    border-bottom: 1px solid #333;
    padding: 0 8px;
}

.tab {
    display: inline-block;
    padding: 6px 14px;
    cursor: pointer;
    color: #888;
}

.tab.active {
    color: #64dc64;
}
</style>
</head>
<body>
<div id="nav-bar">
    <div class="tab" id="tab-perf" data-panel="perf">Perf</div>
    <div class="tab active" id="tab-graphics" data-panel="settings/graphics">Graphics</div>
    <div class="tab" id="tab-audio" data-panel="settings/audio">Audio</div>
    <div class="tab" id="tab-input" data-panel="settings/input">Input</div>
</div>

<script>
(function() {
    var tabs = [
        document.getElementById('tab-perf'),
        document.getElementById('tab-graphics'),
        document.getElementById('tab-audio'),
        document.getElementById('tab-input')
    ];

    function updateActive() {
        var active = __bro.getActivePanel();
        for (var i = 0; i < tabs.length; i++) {
            if (!tabs[i]) continue;
            var panel = tabs[i].getAttribute('data-panel');
            if (panel === active) {
                tabs[i].className = 'tab active';
            } else {
                tabs[i].className = 'tab';
            }
        }
    }

    for (var i = 0; i < tabs.length; i++) {
        if (!tabs[i]) continue;
        tabs[i].addEventListener('click', function(e) {
            var name = this.getAttribute('data-panel');
            if (name !== 'perf') {
                __bro.showPanel(name);
            }
            updateActive();
        });
    }
})();
</script>
</body>
</html>
