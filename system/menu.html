<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #e0e0e0;
}

#menu-root {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
}

#menu-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    /* height set from __bro.menu.getHeight() at render time — must match
       MenuBar::height, which also drives Engine::contentInsets(). */
    background: rgba(20, 20, 20, 240);
    border-bottom: 1px solid #333;
    user-select: none;
}

.root {
    display: inline-block;
    padding: 7px 12px;
    cursor: pointer;
    color: #d0d0d0;
    height: 14px;
    line-height: 14px;
    vertical-align: top;
}

.root-open {
    background: #2a2a2a;
    color: #ffffff;
}

.dropdown {
    position: absolute;
    /* top set inline, alongside #menu-bar's height, from getHeight(). */
    left: 0;
    background: rgba(28, 28, 28, 245);
    border: 1px solid #3a3a3a;
    border-top: none;
    min-width: 180px;
    padding: 4px 0;
}

.item {
    display: block;
    padding: 5px 14px 5px 22px;
    cursor: pointer;
    color: #d0d0d0;
    white-space: nowrap;
    position: relative;
    line-height: 14px;
}

.item:hover { background: #2e4a8a; color: #ffffff; }

.item-disabled { color: #666; cursor: default; }

.item-checked::before {
    content: "*";
    position: absolute;
    left: 8px;
}

.accel {
    margin-left: 24px;
    float: right;
    color: #888;
}

.sep {
    height: 1px;
    background: #3a3a3a;
    margin: 4px 0;
}
</style>
</head>
<body>
<div id="menu-root"></div>

<script>
(function() {
    var root = document.getElementById('menu-root');
    var openRootId = null;
    var tree = [];
    var rootGeom = {};
    var barHeight = __bro.menu.getHeight();

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function estimateWidth(label) {
        // Consolas 12px: ~7px/char + 24px padding (12 + 12).
        return (label ? label.length : 0) * 7 + 24;
    }

    function render() {
        tree = __bro.menu.getTree() || [];
        rootGeom = {};
        var leftPx = 0;
        var rootsHtml = '';
        for (var i = 0; i < tree.length; i++) {
            var r = tree[i];
            if (r.hidden) continue;
            var cls = 'root' + (r.id === openRootId ? ' root-open' : '');
            rootsHtml += '<div class="' + cls + '" data-id="' + escapeHtml(r.id) + '">'
                       + escapeHtml(r.label) + '</div>';
            rootGeom[r.id] = { leftPx: leftPx, widthPx: estimateWidth(r.label) };
            leftPx += rootGeom[r.id].widthPx;
        }

        var ddHtml = '';
        if (openRootId) {
            var openRoot = null;
            for (var k = 0; k < tree.length; k++) {
                if (tree[k].id === openRootId) { openRoot = tree[k]; break; }
            }
            if (openRoot && openRoot.children && openRoot.children.length) {
                var geom = rootGeom[openRootId];
                var ddLeft = geom ? geom.leftPx : 0;
                ddHtml = '<div class="dropdown" style="left:' + ddLeft + 'px;top:' + barHeight + 'px">';
                for (var j = 0; j < openRoot.children.length; j++) {
                    var child = openRoot.children[j];
                    if (child.hidden) continue;
                    if (child.separator) { ddHtml += '<div class="sep"></div>'; continue; }
                    var ic = 'item';
                    if (!child.enabled) ic += ' item-disabled';
                    if (child.checked) ic += ' item-checked';
                    ddHtml += '<div class="' + ic + '" data-id="' + escapeHtml(child.id) + '">';
                    ddHtml += '<span>' + escapeHtml(child.label) + '</span>';
                    if (child.accel) {
                        ddHtml += '<span class="accel">' + escapeHtml(child.accel) + '</span>';
                    }
                    ddHtml += '</div>';
                }
                ddHtml += '</div>';
            }
        }

        root.innerHTML = '<div id="menu-bar" style="height:' + barHeight + 'px">' + rootsHtml + '</div>' + ddHtml;

        // Wire handlers.
        var rootDivs = root.getElementsByClassName('root');
        for (var a = 0; a < rootDivs.length; a++) {
            rootDivs[a].addEventListener('click', onRootClick);
            rootDivs[a].addEventListener('mouseenter', onRootHover);
        }
        var items = root.getElementsByClassName('item');
        for (var b = 0; b < items.length; b++) {
            if (items[b].className.indexOf('item-disabled') < 0) {
                items[b].addEventListener('click', onItemClick);
            }
        }
    }

    function onRootClick(e) {
        var id = this.getAttribute('data-id');
        openRootId = (openRootId === id ? null : id);
        render();
    }

    function onRootHover(e) {
        var id = this.getAttribute('data-id');
        if (openRootId && openRootId !== id) {
            openRootId = id;
            render();
        }
    }

    function onItemClick(e) {
        var id = this.getAttribute('data-id');
        openRootId = null;
        render();
        __bro.menu.click(id);
    }

    window.__onMenuChanged = function() {
        openRootId = null;
        render();
    };

    render();
})();
</script>
</body>
</html>
