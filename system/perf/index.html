<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #e0e0e0;
}

#panel {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 300px;
    background: rgba(0, 0, 0, 224);
    border: 1px solid #333;
    padding: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 1px 0;
}

td.label {
    color: #888;
    width: 70px;
}

td.value {
    text-align: right;
    font-weight: bold;
}

#fps-value {
    color: #64dc64;
}

.divider {
    border-top: 1px solid #333;
    margin: 6px 0;
}

.chart-title {
    color: #888;
    margin-bottom: 4px;
    font-size: 11px;
}

.bar-row {
    margin-bottom: 2px;
    height: 14px;
}

.bar-label {
    display: inline-block;
    width: 50px;
    font-size: 11px;
    color: #999;
}

.bar-track {
    display: inline-block;
    width: 180px;
    height: 10px;
    background: #1a1a1a;
    vertical-align: middle;
}

.bar-fill {
    display: inline-block;
    height: 10px;
    min-width: 1px;
}

.bar-ms {
    display: inline-block;
    width: 50px;
    text-align: right;
    font-size: 10px;
    color: #777;
}

.c-js     { background: #f0c040; }
.c-layout { background: #40a0f0; }
.c-raster { background: #f06040; }
.c-gpu    { background: #40e080; }
.c-draw   { background: #c060f0; }
</style>
</head>
<body>
<div id="panel">
    <table>
        <tr><td class="label">FPS</td><td id="fps-value" class="value">0</td></tr>
        <tr><td class="label">Frame</td><td id="frame-value" class="value">0.0ms</td></tr>
        <tr><td class="label">Viewport</td><td id="viewport-value" class="value">0x0</td></tr>
    </table>

    <div class="divider"></div>
    <div class="chart-title">Phase Timing</div>

    <div class="bar-row">
        <span class="bar-label">JS</span>
        <span class="bar-track"><span id="bar-js" class="bar-fill c-js" style="width: 1px;"></span></span>
        <span id="ms-js" class="bar-ms">0ms</span>
    </div>
    <div class="bar-row">
        <span class="bar-label">Layout</span>
        <span class="bar-track"><span id="bar-layout" class="bar-fill c-layout" style="width: 1px;"></span></span>
        <span id="ms-layout" class="bar-ms">0ms</span>
    </div>
    <div class="bar-row">
        <span class="bar-label">Raster</span>
        <span class="bar-track"><span id="bar-raster" class="bar-fill c-raster" style="width: 1px;"></span></span>
        <span id="ms-raster" class="bar-ms">0ms</span>
    </div>
    <div class="bar-row">
        <span class="bar-label">GPU</span>
        <span class="bar-track"><span id="bar-gpu" class="bar-fill c-gpu" style="width: 1px;"></span></span>
        <span id="ms-gpu" class="bar-ms">0ms</span>
    </div>
    <div class="bar-row">
        <span class="bar-label">Draw</span>
        <span class="bar-track"><span id="bar-draw" class="bar-fill c-draw" style="width: 1px;"></span></span>
        <span id="ms-draw" class="bar-ms">0ms</span>
    </div>
</div>

<script>
(function() {
    var fpsEl = document.getElementById('fps-value');
    var frameEl = document.getElementById('frame-value');
    var vpEl = document.getElementById('viewport-value');

    var barJs = document.getElementById('bar-js');
    var barLayout = document.getElementById('bar-layout');
    var barRaster = document.getElementById('bar-raster');
    var barGpu = document.getElementById('bar-gpu');
    var barDraw = document.getElementById('bar-draw');

    var msJs = document.getElementById('ms-js');
    var msLayout = document.getElementById('ms-layout');
    var msRaster = document.getElementById('ms-raster');
    var msGpu = document.getElementById('ms-gpu');
    var msDraw = document.getElementById('ms-draw');

    function update() {
        var p = __bro.perf;
        var v = __bro.viewport;

        if (fpsEl) fpsEl.textContent = Math.round(p.fps).toString();
        if (frameEl) frameEl.textContent = p.frameTime.toFixed(1) + 'ms';
        if (vpEl) vpEl.textContent = v.width + 'x' + v.height;

        var maxMs = 8.0;
        var phases = [
            [barJs, msJs, p.js],
            [barLayout, msLayout, p.layout],
            [barRaster, msRaster, p.raster],
            [barGpu, msGpu, p.gpu],
            [barDraw, msDraw, p.draw]
        ];

        for (var i = 0; i < phases.length; i++) {
            var bar = phases[i][0];
            var label = phases[i][1];
            var ms = phases[i][2];
            var pct = Math.min(100, (ms / maxMs) * 100);
            var px = Math.max(1, Math.round(pct * 1.8));
            if (bar) bar.style.setProperty('width', px + 'px');
            if (label) label.textContent = ms.toFixed(2) + 'ms';
        }
    }

    setInterval(update, 100);
})();
</script>
</body>
</html>
