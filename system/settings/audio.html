<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #e0e0e0;
}

#panel {
    position: absolute;
    background: #1a1a1a;
    padding: 24px 28px;
    box-sizing: border-box;
}

h1 {
    margin: 0 0 20px 0;
    font-size: 16px;
    font-weight: bold;
    color: #e0e0e0;
}

.slider-row {
    margin-bottom: 14px;
    height: 20px;
}

.label {
    display: inline-block;
    width: 90px;
    color: #999;
    vertical-align: middle;
    line-height: 20px;
}

.slider-track {
    display: inline-block;
    width: 240px;
    height: 10px;
    background: #111111;
    border: 1px solid #2a2a2a;
    vertical-align: middle;
    cursor: pointer;
}

.slider-fill {
    display: inline-block;
    height: 10px;
    background: #40a0f0;
    min-width: 0;
}

.slider-value {
    display: inline-block;
    width: 50px;
    text-align: right;
    color: #ccc;
    margin-left: 10px;
    vertical-align: middle;
    line-height: 20px;
}

.row {
    margin-bottom: 14px;
    height: 24px;
}

.checkbox {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 1px solid #444;
    background: #111111;
    text-align: center;
    line-height: 16px;
    font-size: 12px;
    cursor: pointer;
    vertical-align: middle;
}

.checkbox.checked {
    background: #1e3a5a;
    border-color: #40a0f0;
    color: #40a0f0;
}

.footer {
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 20px;
    border-top: 1px solid #2a2a2a;
    padding-top: 14px;
}

.btn {
    display: inline-block;
    padding: 6px 14px;
    background: #222222;
    border: 1px solid #3a3a3a;
    color: #ccc;
    cursor: pointer;
    font-family: Consolas, monospace;
    font-size: 12px;
}

.btn:hover {
    background: #2a2a2a;
    border-color: #555;
}
</style>
</head>
<body>
<div id="panel">
    <h1>Audio</h1>

    <div class="slider-row">
        <span class="label">Master</span>
        <span class="slider-track" id="master-track"><span class="slider-fill" id="master-fill"></span></span>
        <span class="slider-value" id="master-val">100%</span>
    </div>

    <div class="slider-row">
        <span class="label">Music</span>
        <span class="slider-track" id="music-track"><span class="slider-fill" id="music-fill"></span></span>
        <span class="slider-value" id="music-val">100%</span>
    </div>

    <div class="slider-row">
        <span class="label">SFX</span>
        <span class="slider-track" id="sfx-track"><span class="slider-fill" id="sfx-fill"></span></span>
        <span class="slider-value" id="sfx-val">100%</span>
    </div>

    <div class="row" id="mute-row">
        <span class="label">Mute</span>
        <span class="checkbox" id="mute-cb"></span>
    </div>

    <div class="footer">
        <span class="btn" id="reset-btn">Reset to Defaults</span>
    </div>
</div>

<script src="../lib/panel-runtime.js"></script>
<script>
(function() {
    var panel = document.getElementById('panel');
    PanelLayout.onResize(function() {
        PanelLayout.positionContent(panel);
    });

    var sliders = [
        { key: 'audio.masterVolume', track: 'master-track', fill: 'master-fill', val: 'master-val' },
        { key: 'audio.musicVolume', track: 'music-track', fill: 'music-fill', val: 'music-val' },
        { key: 'audio.sfxVolume', track: 'sfx-track', fill: 'sfx-fill', val: 'sfx-val' }
    ];

    var muteCb = document.getElementById('mute-cb');
    var muteRow = document.getElementById('mute-row');
    var resetBtn = document.getElementById('reset-btn');

    for (var i = 0; i < sliders.length; i++) {
        sliders[i].trackEl = document.getElementById(sliders[i].track);
        sliders[i].fillEl = document.getElementById(sliders[i].fill);
        sliders[i].valEl = document.getElementById(sliders[i].val);
    }

    function load() {
        var all = bro.settings.getAll();
        var vals = [all.audio.masterVolume, all.audio.musicVolume, all.audio.sfxVolume];
        for (var i = 0; i < sliders.length; i++) {
            var pct = Math.round(vals[i] * 100);
            sliders[i].fillEl.style.setProperty('width', pct + '%');
            sliders[i].valEl.textContent = pct + '%';
        }

        if (all.audio.muted) {
            muteCb.textContent = 'x';
            muteCb.className = 'checkbox checked';
        } else {
            muteCb.textContent = '';
            muteCb.className = 'checkbox';
        }
    }

    function handleSliderClick(slider, x) {
        var rect = slider.trackEl.getBoundingClientRect();
        var pct = (x - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        bro.settings.set(slider.key, pct);
        load();
    }

    for (var i = 0; i < sliders.length; i++) {
        (function(s) {
            s.trackEl.addEventListener('click', function(e) {
                handleSliderClick(s, e.clientX);
            });
        })(sliders[i]);
    }

    muteRow.addEventListener('click', function() {
        bro.settings.set('audio.muted', !bro.settings.get('audio.muted'));
        load();
    });

    resetBtn.addEventListener('click', function() {
        bro.settings.reset('audio');
        load();
    });

    load();
})();
</script>
</body>
</html>
