<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #e0e0e0;
}

/* The card content region; positioned by JS to match the nav modal. */
#panel {
    position: absolute;
    background: #1a1a1a;
    padding: 24px 28px;
    box-sizing: border-box;
}

h1 {
    margin: 0 0 20px 0;
    font-size: 16px;
    font-weight: bold;
    color: #e0e0e0;
}

.row {
    margin-bottom: 14px;
    height: 24px;
}

.label {
    display: inline-block;
    width: 140px;
    color: #999;
    vertical-align: middle;
    line-height: 24px;
}

.control {
    display: inline-block;
    vertical-align: middle;
}

select {
    background: #111111;
    color: #e0e0e0;
    border: 1px solid #333;
    padding: 4px 8px;
    font-family: Consolas, monospace;
    font-size: 12px;
    width: 220px;
}

.checkbox {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 1px solid #444;
    background: #111111;
    text-align: center;
    line-height: 16px;
    font-size: 12px;
    cursor: pointer;
    vertical-align: middle;
}

.checkbox.checked {
    background: #2a5a2a;
    border-color: #64dc64;
    color: #64dc64;
}

.footer {
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 20px;
    border-top: 1px solid #2a2a2a;
    padding-top: 14px;
}

.btn {
    display: inline-block;
    padding: 6px 14px;
    background: #222222;
    border: 1px solid #3a3a3a;
    color: #ccc;
    cursor: pointer;
    font-family: Consolas, monospace;
    font-size: 12px;
}

.btn:hover {
    background: #2a2a2a;
    border-color: #555;
}
</style>
</head>
<body>
<div id="panel">
    <h1>Graphics</h1>

    <div class="row">
        <span class="label">Resolution</span>
        <span class="control"><select id="resolution"></select></span>
    </div>

    <div class="row" id="fullscreen-row">
        <span class="label">Fullscreen</span>
        <span class="control"><span class="checkbox" id="fullscreen-cb"></span></span>
    </div>

    <div class="row" id="vsync-row">
        <span class="label">VSync</span>
        <span class="control"><span class="checkbox" id="vsync-cb"></span></span>
    </div>

    <div class="row">
        <span class="label">FPS Cap</span>
        <span class="control"><select id="fps-cap"></select></span>
    </div>

    <div class="footer">
        <span class="btn" id="reset-btn">Reset to Defaults</span>
    </div>
</div>

<script src="../lib/panel-runtime.js"></script>
<script>
(function() {
    var panel = document.getElementById('panel');
    PanelLayout.onResize(function() {
        PanelLayout.positionContent(panel);
    });

    var resSelect = document.getElementById('resolution');
    var fullscreenCb = document.getElementById('fullscreen-cb');
    var fullscreenRow = document.getElementById('fullscreen-row');
    var vsyncCb = document.getElementById('vsync-cb');
    var vsyncRow = document.getElementById('vsync-row');
    var fpsCap = document.getElementById('fps-cap');
    var resetBtn = document.getElementById('reset-btn');

    // Curated resolutions: a few common 16:9 and 16:10 sizes, filtered to
    // what the current display actually supports, plus the app's bro.json
    // default (so "Reset to Defaults" round-trips cleanly). Users who want
    // something else can just drag the window edge.
    var CURATED = [
        [1280, 720], [1600, 900], [1920, 1080], [2560, 1440], [3840, 2160],
        [1440, 900], [1680, 1050], [1920, 1200], [2560, 1600]
    ];
    var supported = {};
    var modes = bro.settings.getDisplayModes();
    for (var i = 0; i < modes.length; i++) {
        supported[modes[i].width + 'x' + modes[i].height] = true;
    }

    var defaults = bro.settings.getDefaults('graphics');
    var defaultKey = defaults.width + 'x' + defaults.height;

    var keys = [];
    var seen = {};
    function addKey(k) {
        if (seen[k]) return;
        seen[k] = true;
        keys.push(k);
    }
    addKey(defaultKey);
    for (var i = 0; i < CURATED.length; i++) {
        var k = CURATED[i][0] + 'x' + CURATED[i][1];
        if (supported[k]) addKey(k);
    }
    keys.sort(function(a, b) {
        var pa = a.split('x'), pb = b.split('x');
        return (parseInt(pa[0]) * parseInt(pa[1])) - (parseInt(pb[0]) * parseInt(pb[1]));
    });

    for (var i = 0; i < keys.length; i++) {
        var opt = document.createElement('option');
        opt.value = keys[i];
        opt.textContent = keys[i] + (keys[i] === defaultKey ? ' (default)' : '');
        resSelect.appendChild(opt);
    }

    var caps = [
        { label: 'Uncapped', value: 0 },
        { label: '30 FPS', value: 33.33 },
        { label: '60 FPS', value: 16.67 },
        { label: '120 FPS', value: 8.33 },
        { label: '144 FPS', value: 6.94 },
        { label: '240 FPS', value: 4.17 }
    ];
    for (var i = 0; i < caps.length; i++) {
        var opt = document.createElement('option');
        opt.value = caps[i].value.toString();
        opt.textContent = caps[i].label;
        fpsCap.appendChild(opt);
    }

    function load() {
        var all = bro.settings.getAll();
        var curKey = all.graphics.width + 'x' + all.graphics.height;

        // If the window was manually resized to something not in the curated
        // list, surface a transient "current" option so the dropdown reflects
        // reality instead of silently snapping to the first entry.
        var customOpt = resSelect.querySelector('option[data-custom="1"]');
        if (customOpt) customOpt.remove();
        if (!seen[curKey]) {
            var opt = document.createElement('option');
            opt.value = curKey;
            opt.textContent = curKey + ' (current)';
            opt.setAttribute('data-custom', '1');
            resSelect.insertBefore(opt, resSelect.firstChild);
        }
        resSelect.value = curKey;

        if (all.graphics.fullscreen) {
            fullscreenCb.textContent = 'x';
            fullscreenCb.className = 'checkbox checked';
        } else {
            fullscreenCb.textContent = '';
            fullscreenCb.className = 'checkbox';
        }

        if (all.graphics.vsync) {
            vsyncCb.textContent = 'x';
            vsyncCb.className = 'checkbox checked';
        } else {
            vsyncCb.textContent = '';
            vsyncCb.className = 'checkbox';
        }

        var interval = all.graphics.maxFrameIntervalMs;
        var best = '0';
        for (var i = 0; i < caps.length; i++) {
            if (Math.abs(caps[i].value - interval) < 0.5) {
                best = caps[i].value.toString();
                break;
            }
        }
        fpsCap.value = best;
    }

    resSelect.addEventListener('change', function() {
        var parts = resSelect.value.split('x');
        bro.settings.set('graphics.width', parseInt(parts[0]));
        bro.settings.set('graphics.height', parseInt(parts[1]));
    });

    fullscreenRow.addEventListener('click', function() {
        bro.settings.set('graphics.fullscreen', !bro.settings.get('graphics.fullscreen'));
        load();
    });

    vsyncRow.addEventListener('click', function() {
        bro.settings.set('graphics.vsync', !bro.settings.get('graphics.vsync'));
        load();
    });

    fpsCap.addEventListener('change', function() {
        bro.settings.set('graphics.maxFrameIntervalMs', parseFloat(fpsCap.value));
    });

    resetBtn.addEventListener('click', function() {
        bro.settings.reset('graphics');
        load();
    });

    load();
})();
</script>
</body>
</html>
