name: Nightly

# Builds the full profile (renderer + net/video/steam + AI tower) for
# Linux / Windows / macOS-arm64 every night and publishes the binaries to a
# single rolling "nightly" release, marked Latest. The tag is re-pointed each
# run, so downloaders always find one "latest nightly". If hand-cut vX.Y.Z
# releases resume, revisit the --latest flag in Publish below — nightly claims
# Latest unconditionally today because it is the only channel bro ships.
#
# Friendliness: brotensor compiles its CUDA backend as pure C++ (Brass MIR ->
# PTX JIT) and loads nvcuda.dll / libcuda.so.1 dynamically with zero CUDA Toolkit
# runtime dependencies, so one binary launches on any machine — it uses an
# NVIDIA GPU when the driver is present and falls back to CPU otherwise. macOS
# uses Metal (always present). Nothing extra to install.
#
# JavaScript is compiled by the engine itself: in process at boot, and for an
# installed app ahead of time on its first run's profile (docs/apps.md,
# "Ahead-of-time scripts"), by brass's own image writer, so the zip needs no
# separate compiler.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:       # manual "Run workflow" button

# One nightly at a time; a newer trigger cancels an in-flight run.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write          # publish/replace the rolling release

env:
  # Must match vcpkg.json's builtin-baseline — the manifest pins port versions,
  # this pins the vcpkg tool + scripts to the same commit (the runner's
  # preinstalled vcpkg drifts with every image update).
  VCPKG_COMMIT: 0b88aacde46a853151730fbe7d0b7ee45f4b6864
  VCPKG_FORCE_SYSTEM_BINARIES: "1"
  # The Windows build configures against the LunarG Vulkan SDK (headers +
  # vulkan-1.lib); scripts/ci/install-vulkan-sdk-windows.sh checks the hash.
  VULKAN_SDK_VERSION: 1.4.363.0
  VULKAN_SDK_SHA256: 94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141
  # Persist the sccache object cache in the GitHub Actions cache across runs.
  # Without this sccache silently falls back to per-runner LOCAL DISK, which is
  # wiped between runs — so every night recompiled from scratch (0 hits, all
  # writes thrown away). This is the one switch that makes nightly-to-nightly
  # caching actually work. The sccache-action exports the cache service token.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # id-token lets the Windows job mint a GitHub OIDC token and exchange it for
    # an Azure one (see the signing steps). Declared per-job rather than at the
    # top level so only this job can request it; publish keeps contents:write.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # jobs: bounded -j so a heavy full-profile TU set doesn't OOM the runner.
          # macOS-15 has ~7 GB, so 3; the 16 GB Linux/Windows runners take 4.
          - { name: linux,   os: ubuntu-24.04, cuda: true,  triplet: x64-linux,   jobs: 4 }
          - { name: windows, os: windows-2022, cuda: true,  triplet: x64-windows, jobs: 4 }
          # macos-15 at minimum: brotensor's Metal offset path calls MPSNDArray
          # -initWithBuffer:offset:descriptor:, which is a macOS-15-only MPS
          # selector the macOS 14 SDK doesn't declare, so the build would fail
          # to compile there.
          - { name: macos,   os: macos-15,     cuda: false, triplet: arm64-osx,   jobs: 3 }
    steps:
      # A plain clone: configure fetches every sibling at the head of its main
      # (on a release tag, at the commit cmake/bro_lock.cmake locks), bronze
      # included — the compiler shipped in the zip is that one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # tags needed for package-release.sh's version fallback

      # SDL3 is built from the pinned source. Linux gets the Vulkan headers and
      # loader and Lavapipe (mesa-vulkan-drivers), the software Vulkan device
      # the smoke tests run on. Shaders need nothing here: glslang is built
      # from source in-process (cmake/glslang.cmake).
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm libvulkan-dev mesa-vulkan-drivers \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev \
            libfreetype-dev libfontconfig1-dev libpng-dev libjpeg-dev libwebp-dev \
            libsystemd-dev libseat-dev libxcb-randr0-dev libxau-dev libinput-dev \
            libdrm-dev libgbm-dev

      # MoltenVK + the Khronos loader: linked at build time, and bundled into
      # the package by package-release.sh (macOS has no system Vulkan).
      - name: Ninja and Vulkan (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install ninja molten-vk vulkan-loader vulkan-headers

      # Put cl.exe / the MSVC toolset on PATH so the Windows build can use the
      # Ninja generator (below) instead of Visual Studio. The VS generator
      # ignores CMAKE_*_COMPILER_LAUNCHER, so with it sccache saw zero compiles;
      # Ninja honors the launcher.
      - name: MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/ci/install-vulkan-sdk-windows.sh

      - name: Seed sccache tool cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCH="x64"; ASSET="sccache-v0.19.0-x86_64-pc-windows-msvc.tar.gz"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ARCH="arm64"; ASSET="sccache-v0.19.0-aarch64-apple-darwin.tar.gz"
          else
            ARCH="x64"; ASSET="sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz"
          fi
          DEST="$RUNNER_TOOL_CACHE/sccache/0.19.0/$ARCH"
          mkdir -p "$DEST"
          if (cd "$DEST" && gh release download v0.19.0 -R mozilla/sccache -p "$ASSET" -O "$ASSET" && tar -xzf "$ASSET" --strip-components=1 && rm -f "$ASSET"); then
            touch "${DEST}.complete"
          fi

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      # Persist vcpkg's built-package archives across runs (same scheme as
      # ci.yml: per-run key + restore-keys pick the newest, so rebuilds after
      # an ABI change are re-saved). ci.yml and nightly share these caches —
      # the key is content-addressed per package, not per workflow.
      - name: vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bin-${{ matrix.triplet }}-

      # Dependencies (gamenetworkingsockets, libvpx, libwebm, opus,
      # recastnavigation + transitives) come from vcpkg.json, pinned by its
      # builtin-baseline; the vcpkg toolchain installs them during CMake
      # configure. Clone vcpkg at that same commit so tool + ports + scripts
      # are all pinned together.
      - name: vcpkg (pinned)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --reference-if-able "${VCPKG_INSTALLATION_ROOT:-}" https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          sed -i.bak 's|\${github_host}/\${org_name}/\${repo_name}/archive/\${ref_to_use}\.tar\.gz|https://codeload.github.com/${org_name}/${repo_name}/tar.gz/${ref_to_use}|g' "$RUNNER_TEMP/vcpkg/scripts/cmake/vcpkg_from_github.cmake"
          . "$RUNNER_TEMP/vcpkg/scripts/vcpkg-tool-metadata.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release download "$VCPKG_TOOL_RELEASE_TAG" -R microsoft/vcpkg-tool -p "vcpkg.exe" -O "$RUNNER_TEMP/vcpkg/vcpkg.exe" || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          elif [ "$RUNNER_OS" = "Linux" ]; then
            (gh release download "$VCPKG_TOOL_RELEASE_TAG" -R microsoft/vcpkg-tool -p "vcpkg-glibc" -O "$RUNNER_TEMP/vcpkg/vcpkg" && chmod +x "$RUNNER_TEMP/vcpkg/vcpkg") || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          else
            (gh release download "$VCPKG_TOOL_RELEASE_TAG" -R microsoft/vcpkg-tool -p "vcpkg-macos" -O "$RUNNER_TEMP/vcpkg/vcpkg" && chmod +x "$RUNNER_TEMP/vcpkg/vcpkg") || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          touch "$RUNNER_TEMP/vcpkg/vcpkg.disable-metrics"
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          # native GPU-arch detection can't run on a GPU-less runner, so target a
          # broad set (major cubins + newest PTX) for a widely-runnable binary.
          GPU_ARGS=""
          if [ "${{ matrix.cuda }}" = "true" ]; then
            # Compile brotensor's CUDA backend IN. BRO_WITH_TENSOR_CUDA is off even
            # in the full profile (it's opt-in), so without this the nightly ships
            # a CPU-only AI tower — bro.gpu reports 'cpu' and models never touch
            # the GPU. This is what makes the release notes' "uses your NVIDIA GPU
            # when present" actually true. brotensor's CUDA backend compiles as
            # pure C++ (Brass MIR -> PTX JIT + dynamic driver loader), requiring no
            # CUDA Toolkit installation or nvcc flags.
            GPU_ARGS="-DBRO_WITH_TENSOR_CUDA=ON"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # macOS: compile the Metal backend IN (also opt-in, same reason). Metal
            # is always present on Apple hardware, so no toolkit install is needed.
            GPU_ARGS="-DBRO_WITH_TENSOR_METAL=ON"
          fi
          GEN_ARGS="-G Ninja"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Ninja (with the MSVC env set above) so the sccache compiler launcher
            # is actually honored — the default Visual Studio generator ignores
            # it. Single-config, so CMAKE_BUILD_TYPE drives it. Embedded debug
            # info (/Z7) instead of a separate PDB (/Zi) is what lets sccache
            # cache MSVC objects at all.
            GEN_ARGS="-G Ninja -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          fi
          cmake -B build \
            -DBRO_PROFILE=full \
            -DBROGAMEAGENT_WITH_NAVMESH=ON \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            $GPU_ARGS \
            $GEN_ARGS

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}

      # Prove the shipped binary launches on this runner and — critically — that
      # the GPU tensor backend was actually COMPILED IN. Single-config generators
      # put the exe directly in build/ (Windows now uses Ninja too); keep the
      # multi-config build/Release/ probe as a fallback.
      - name: Smoke test (launch + backend probe)
        shell: bash
        run: |
          if [ -x build/bro-headless.exe ]; then BH=build/bro-headless.exe;
          elif [ -x build/bro-headless ]; then BH=build/bro-headless;
          elif [ -x build/Release/bro-headless.exe ]; then BH=build/Release/bro-headless.exe;
          else echo "bro-headless not found" >&2; exit 1; fi
          # The GPU backend this build MUST contain: CUDA on linux/windows, Metal
          # on macOS. The runners have no GPU, so bro.gpu.backend/available report
          # 'cpu'/false even for a correct binary — they CANNOT catch a CPU-only
          # build. bro.gpu.compiledBackends is the static build-time fact (read
          # from brotensor's own BROTENSOR_HAS_* defines — what it truly compiled),
          # so asserting the expected backend is present is what actually guards
          # against nightly regressing to CPU-only ML.
          if [ "${{ matrix.cuda }}" = "true" ]; then EXPECT=cuda; else EXPECT=metal; fi
          # bro-headless requires an app directory; use the bundled "blank"
          # skeleton (self-contained, no external repo). The probe throws — failing
          # the job — if bro.gpu is missing or the expected backend wasn't compiled
          # in; otherwise it prints the runtime backend (honestly 'cpu' here) and
          # the compiled-in set.
          APP=system/skeletons/blank
          PROBE="if(!bro.gpu||!bro.gpu.backend)throw new Error('bro.gpu backend missing');if(!(bro.gpu.compiledBackends||[]).includes('$EXPECT'))throw new Error('GPU backend $EXPECT NOT compiled in; compiledBackends='+JSON.stringify(bro.gpu.compiledBackends));console.log('backend='+bro.gpu.backend+' available='+bro.gpu.available+' compiledBackends='+JSON.stringify(bro.gpu.compiledBackends))"
          # bro needs a Vulkan device: the Linux runner has Lavapipe, but the
          # Windows runner has no Vulkan driver and the macOS one may expose no
          # Metal device for MoltenVK. Where none comes up, say so and move on.
          if OUT="$("$BH" "$APP" -e 0 2>&1)"; then
            "$BH" "$APP" -e "$PROBE"
          else
            echo "::notice::no Vulkan device on this runner; backend probe not run"
            echo "$OUT" | grep -iE "Vulkan|Fatal" | head -5
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "Windows" ]; then
            scripts/package-release.sh --version "$VERSION" --build-dir build --config Release
          else
            scripts/package-release.sh --version "$VERSION" --build-dir build
          fi

      # An installed app's scripts compiled ahead of time, from the packaged
      # tree and nowhere else: a first run harvested, a build on its profile
      # written by the engine's own module writer, and a run of that module
      # by the SHIPPED bro-headless. This catches a module the host refuses
      # (ABI stamp), a module writer that cannot write, and (on Linux/macOS)
      # a shared runtime a module cannot find once the tree has moved off the
      # build machine. It runs before signing so a bad package is never signed.
      - name: Smoke test (packaged ahead-of-time scripts)
        shell: bash
        run: |
          d=$(ls -d dist/bro-${VERSION}-*/ | sed 's:/$::' | head -1)
          PKG="$(pwd)/$d"
          mkdir -p "$PKG/smokeapp"
          echo '<!doctype html><html><body><script src="main.js"></script></body></html>' > "$PKG/smokeapp/index.html"
          cat > "$PKG/smokeapp/main.js" <<'JS'
          const c = document.createElement('canvas');
          c.width = 64; c.height = 64;
          document.body.appendChild(c);
          console.log("APP ok=" + (c.width * c.height));
          JS
          cd "$PKG"
          # bro-headless needs a Vulkan device (Lavapipe on the Linux runner);
          # a runner with none skips the check, saying so. Where the AOT build
          # cannot run (macOS has no app executables, docs/apps.md), the page
          # still runs from the packaged tree, compiled in process.
          if ! RUN="$(./bro-headless smokeapp -e 'advanceTime(64)' 2>&1)"; then
            echo "::notice::no Vulkan device on this runner; packaged smoke test not run"
            echo "$RUN" | grep -iE "Vulkan|Fatal" | head -5
          else
            grep -q 'APP ok=4096' <<<"$RUN"
            if ./bro-headless smokeapp --aot-build smokeaot >/dev/null 2>&1; then
              FIRST="$(./bro-headless --aot smokeaot smokeapp -e 'advanceTime(64)' 2>&1)"
              grep -q 'APP ok=4096' <<<"$FIRST"
              ./bro-headless smokeapp --aot-build smokeaot
              OUT="$(./bro-headless --aot smokeaot smokeapp -e 'advanceTime(64)' 2>&1)"
              grep -E 'APP |aot:' <<<"$OUT"
              grep -q 'APP ok=4096' <<<"$OUT"
              grep -q 'runs its ahead-of-time module' <<<"$OUT"
            elif [ "$RUNNER_OS" = "macOS" ]; then
              echo "::notice::no AOT directories on macOS; the packaged page ran compiled in process"
            else
              echo "::error::--aot-build failed from the packaged tree"
              ./bro-headless smokeapp --aot-build smokeaot 2>&1 | tail -20
              exit 1
            fi
          fi
          # Leave nothing behind: the zip is cut from this directory.
          rm -rf "$PKG/smokeapp" "$PKG/smokeaot"

      # The macOS package carries its own Vulkan loader and MoltenVK (no macOS
      # has either). Check, from the packaged tree, that the shipped
      # bro-headless loads the bundled loader rather than Homebrew's and that
      # the loader picks up the bundled MoltenVK manifest; then, if this
      # runner has a Metal device, that a Vulkan device actually comes up.
      # Homebrew's copies are moved out of the way first so nothing can fall
      # back to them.
      - name: Smoke test (packaged Vulkan runtime, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          d=$(ls -d dist/bro-${VERSION}-*/ | sed 's:/$::' | head -1)
          cd "$d"
          grep -qE '@(loader|executable)_path/libvulkan.1.dylib' <<<"$(otool -L libbro.dylib bro-headless)"
          [ -f vulkan/icd.d/MoltenVK_icd.json ] && [ -f vulkan/icd.d/libMoltenVK.dylib ]
          BREW_ICD="$(brew --prefix)/etc/vulkan/icd.d"
          [ -d "$BREW_ICD" ] && sudo mv "$BREW_ICD" "$BREW_ICD.off"
          mkdir -p probeapp && echo '<!doctype html><html><body></body></html>' > probeapp/index.html
          OUT="$(VK_LOADER_DEBUG=driver ./bro-headless probeapp -e 0 2>&1 || true)"
          rm -rf probeapp
          [ -d "$BREW_ICD.off" ] && sudo mv "$BREW_ICD.off" "$BREW_ICD"
          grep -iE "MoltenVK|Vulkan:" <<<"$OUT" | head -20 || true
          grep -q "vulkan/icd.d/MoltenVK_icd.json" <<<"$OUT"
          if grep -q "Vulkan: Initialized successfully" <<<"$OUT"; then
            echo "bundled MoltenVK brought up a Vulkan device"
          else
            echo "::warning title=macOS Vulkan device::the bundled loader found the bundled MoltenVK, but this runner exposes no Metal device, so device bring-up was not verified"
          fi

      # --- Windows code signing ---------------------------------------------
      # Signs the packaged tree before it is zipped, so what users download is
      # what was signed. Authenticode covers PE files only; the Linux and macOS
      # zips ship unsigned (macOS notarization needs an Apple Developer ID,
      # which is a separate thing entirely).
      #
      # No key or secret exists in this repo or on the runner. Auth is GitHub
      # OIDC federation against an Entra app whose federated credential only
      # trusts subject repo:wlejon/bro:ref:refs/heads/main, and the signing key
      # itself never leaves Azure's HSM — the action uploads a digest and gets a
      # signature back. The three AZURE_* values below are identifiers, not
      # credentials, which is why they are `vars` and not `secrets`.
      #
      # Timestamping is load-bearing, not optional: Artifact Signing issues
      # ~3-day certificates, so an untimestamped signature stops validating
      # almost immediately. The RFC3161 countersignature is what pins validity
      # to signing time and keeps old nightlies verifiable after rotation.
      - name: Resolve package directory (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          d=$(ls -d dist/bro-${VERSION}-*/ | sed 's:/$::' | head -1)
          # Absolute Windows path — the signing action is .NET and does not
          # understand MSYS-style /d/... paths.
          echo "PKG_DIR=$(cygpath -w "$(pwd)/$d")" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, no stored secret)
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://cus.codesigning.azure.net/
          signing-account-name: brosigning
          certificate-profile-name: broPublicTrust
          files-folder: ${{ env.PKG_DIR }}
          # The three executables plus the vcpkg DLLs loaded into our process.
          # Basic SKU allows 5,000 signatures/month; a nightly uses ~20.
          files-folder-filter: exe,dll
          # Depth 2 reaches a binary one folder down without walking all of
          # system/.
          files-folder-recurse: true
          files-folder-depth: 2
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Fail the job rather than publish silently-unsigned binaries if the step
      # above ever soft-fails. Get-AuthenticodeSignature is used instead of
      # signtool because it is built into PowerShell and needs no SDK path hunt.
      - name: Verify signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = @()
          # The shared runtime is in this list because it is as much a part of
          # what a user runs as bro.exe is, and an unsigned binary inside a
          # signed package is the one a machine blocks.
          foreach ($exe in @('bro.exe','bro-headless.exe','bro-server.exe',
                             'bronze_runtime_shared.dll')) {
            $p = Join-Path $env:PKG_DIR $exe
            if (-not (Test-Path $p)) { Write-Host "MISSING $exe"; $bad += $exe; continue }
            $sig = Get-AuthenticodeSignature $p
            Write-Host "$exe -> $($sig.Status) | $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad += $exe }
          }
          if ($bad.Count) { throw "unsigned or invalid: $($bad -join ', ')" }

      - name: Zip
        shell: bash
        run: |
          cd dist
          d=$(ls -d bro-${VERSION}-*/ | sed 's:/$::' | head -1)
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${d}.zip" "$d" >/dev/null
          else
            zip -qr "../${d}.zip" "$d"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bro-${{ matrix.name }}
          path: bro-nightly-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rolling nightly
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7      # for the commit sha the release targets
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Re-point the single "nightly" tag/release at this run's commit and
      # replace its assets. Deleting first (with --cleanup-tag) is the reliable
      # way to move the tag.
      #
      # --latest is explicit and load-bearing: nightly is the only release bro
      # publishes right now, so it must be the one GitHub serves at
      # /releases/latest and shows at the top of the releases page. Without it
      # (or worse, with --prerelease, which is what this used to do) GitHub
      # falls back to "most recent non-prerelease" and picks whatever else
      # happens to exist — in practice the skia-prebuilt-m147 build artifact,
      # which is infrastructure and not something to hand a user.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          NOTES="Automated nightly build from \`${GITHUB_SHA::7}\` on $(date -u +%Y-%m-%d).

          Single self-contained binary per platform — uses your NVIDIA GPU when present, falls back to CPU otherwise (macOS uses Metal). bro is pre-alpha; nightly is the current release channel.

          JavaScript is compiled by the engine itself: \`bro myapp\` compiles the app's scripts in process, and \`bro --install myapp\` gives it an executable of its own whose scripts are compiled ahead of time on what its first run did. No compiler, linker or toolchain is needed on the machine."
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --title "Nightly ($(date -u +%Y-%m-%d))" \
            --notes "$NOTES" \
            --latest \
            artifacts/*.zip
