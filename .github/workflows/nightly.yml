name: Nightly

# Builds the full profile (renderer + net/video/steam + AI tower) for
# Linux / Windows / macOS-arm64 every night and publishes the binaries to a
# single rolling "nightly" release, marked Latest. The tag is re-pointed each
# run, so downloaders always find one "latest nightly". If hand-cut vX.Y.Z
# releases resume, revisit the --latest flag in Publish below — nightly claims
# Latest unconditionally today because it is the only channel bro ships.
#
# Friendliness: the CUDA siblings link cudart_static, so one binary launches on
# any machine — it uses an NVIDIA GPU when the driver is present and falls back
# to CPU otherwise. macOS uses Metal (always present). Nothing extra to install.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:       # manual "Run workflow" button

# One nightly at a time; a newer trigger cancels an in-flight run.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write          # publish/replace the rolling release

env:
  # Must match vcpkg.json's builtin-baseline — the manifest pins port versions,
  # this pins the vcpkg tool + scripts to the same commit (the runner's
  # preinstalled vcpkg drifts with every image update).
  VCPKG_COMMIT: 0b88aacde46a853151730fbe7d0b7ee45f4b6864
  # Persist the sccache object cache in the GitHub Actions cache across runs.
  # Without this sccache silently falls back to per-runner LOCAL DISK, which is
  # wiped between runs — so every night recompiled from scratch (0 hits, all
  # writes thrown away). This is the one switch that makes nightly-to-nightly
  # caching actually work. The sccache-action exports the cache service token.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # id-token lets the Windows job mint a GitHub OIDC token and exchange it for
    # an Azure one (see the signing steps). Declared per-job rather than at the
    # top level so only this job can request it; publish keeps contents:write.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # jobs: bounded -j so a heavy full-profile TU set doesn't OOM the runner.
          # macOS-14 has ~7 GB, so 3; the 16 GB Linux/Windows runners take 4.
          - { name: linux,   os: ubuntu-24.04, cuda: true,  triplet: x64-linux,   jobs: 4 }
          - { name: windows, os: windows-2022, cuda: true,  triplet: x64-windows, jobs: 4 }
          # macos-15: brotensor's Metal offset path calls MPSNDArray
          # -initWithBuffer:offset:descriptor:, which is a macOS-15-only MPS
          # selector — the macos-14 runner's SDK doesn't declare it and the
          # build fails to compile. macos-15 ships the SDK that has it.
          - { name: macos,   os: macos-15,     cuda: false, triplet: arm64-osx,   jobs: 3 }
    steps:
      # The AI-tower + flora submodules use git@github.com: URLs. Rewrite them
      # to HTTPS *before* checkout so the default GITHUB_TOKEN can fetch them
      # (every sibling repo is public). Must run before actions/checkout syncs
      # submodule URLs into .git/config.
      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0        # tags needed for package-release.sh's version fallback

      # SDL3 is built from third_party/SDL; on Linux it needs the X11/Wayland/GL
      # and audio dev headers to configure. Ninja is the single-config generator
      # used on Linux/macOS.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm xvfb libgl1-mesa-dri \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libfreetype-dev libfontconfig1-dev libpng-dev libjpeg-dev libwebp-dev

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install CUDA Toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.6.2"
          method: network
          use-github-cache: true
          # Linux only: install just the build sub-packages, not the full "cuda"
          # meta-package. The meta pulls in nvidia-driver-*-open, whose DKMS
          # post-install fails on a driverless GitHub runner (dpkg exit 10) and
          # reds the whole job. The AI tower links CUDA::cudart_static and
          # compiles its own kernels (no cuBLAS/cuRAND/cuFFT), so nvcc + the
          # cudart dev package (static lib + headers) is all it needs; naming
          # sub-packages excludes the driver. Windows has no DKMS driver step and
          # its full install already works, so leave it on the default ('[]' =
          # full) there.
          sub-packages: ${{ runner.os == 'Linux' && '["nvcc", "cudart-dev"]' || '[]' }}

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Persist vcpkg's built-package archives across runs (same scheme as
      # ci.yml: per-run key + restore-keys pick the newest, so rebuilds after
      # an ABI change are re-saved). ci.yml and nightly share these caches —
      # the key is content-addressed per package, not per workflow.
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-bin-${{ matrix.triplet }}-

      # Dependencies (gamenetworkingsockets, libvpx, libwebm, opus,
      # recastnavigation + transitives) come from vcpkg.json, pinned by its
      # builtin-baseline; the vcpkg toolchain installs them during CMake
      # configure. Clone vcpkg at that same commit so tool + ports + scripts
      # are all pinned together.
      - name: vcpkg (pinned)
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"

      # Put cl.exe / the MSVC toolset on PATH so the Windows build can use the
      # Ninja generator (below) instead of Visual Studio. The VS generator
      # ignores CMAKE_*_COMPILER_LAUNCHER, so with it sccache saw zero compiles;
      # Ninja honors the launcher. Also gives nvcc its cl host compiler.
      - name: MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          # native GPU-arch detection can't run on a GPU-less runner, so target a
          # broad set (major cubins + newest PTX) for a widely-runnable binary.
          GPU_ARGS=""
          if [ "${{ matrix.cuda }}" = "true" ]; then
            # Compile brotensor's CUDA backend IN. BRO_WITH_TENSOR_CUDA is off even
            # in the full profile (it's opt-in and the heaviest build cost), so
            # without this the nightly ships a CPU-only AI tower — bro.gpu reports
            # 'cpu' and models never touch the GPU. This is what makes the release
            # notes' "uses your NVIDIA GPU when present" actually true.
            # sccache caches nvcc too — route the CUDA compiler through it as well,
            # or the brotensor kernels (the heaviest TUs) recompile from scratch
            # every night while the C/C++ objects hit the cache.
            # Ampere+ (sm_80+) only. brotensor's AI tower is built around BF16
            # tensor cores: its WMMA kernels instantiate __nv_bfloat16
            # wmma::fragment unconditionally (no __CUDA_ARCH__ guard), and BF16
            # WMMA fragments only exist on sm_80+. So pre-Ampere device passes
            # fail to compile: sm_50/sm_60 have no tensor cores at all (nvcuda
            # namespace undefined), and sm_70/sm_75 (Volta/Turing) have FP16 WMMA
            # but no BF16 fragment type (incomplete-type error). `all-major`
            # includes all of those. Target Ampere and later — the arches this
            # BF16 code can actually run on. -real cubins for the common arches +
            # a newest-arch PTX tail for forward compatibility.
            CUDA_ARCHS="80-real;86-real;89-real;90-real;90-virtual"
            GPU_ARGS="-DBRO_WITH_TENSOR_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCHS -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # macOS: compile the Metal backend IN (also opt-in, same reason). Metal
            # is always present on Apple hardware, so no toolkit install is needed.
            GPU_ARGS="-DBRO_WITH_TENSOR_METAL=ON"
          fi
          GEN_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Ninja (with the MSVC env set above) so the sccache compiler launcher
            # is actually honored — the default Visual Studio generator ignores
            # it. Single-config, so CMAKE_BUILD_TYPE drives it. Embedded debug
            # info (/Z7) instead of a separate PDB (/Zi) is what lets sccache
            # cache MSVC objects at all.
            GEN_ARGS="-G Ninja -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          fi
          cmake -B build \
            -DBRO_PROFILE=full \
            -DBROGAMEAGENT_WITH_NAVMESH=ON \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            $GPU_ARGS \
            $GEN_ARGS

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}

      # Prove the shipped binary launches on this runner and — critically — that
      # the GPU tensor backend was actually COMPILED IN. Single-config generators
      # put the exe directly in build/ (Windows now uses Ninja too); keep the
      # multi-config build/Release/ probe as a fallback.
      - name: Smoke test (launch + backend probe)
        shell: bash
        run: |
          if [ -x build/bro-headless.exe ]; then BH=build/bro-headless.exe;
          elif [ -x build/bro-headless ]; then BH=build/bro-headless;
          elif [ -x build/Release/bro-headless.exe ]; then BH=build/Release/bro-headless.exe;
          else echo "bro-headless not found" >&2; exit 1; fi
          # The GPU backend this build MUST contain: CUDA on linux/windows, Metal
          # on macOS. The runners have no GPU, so bro.gpu.backend/available report
          # 'cpu'/false even for a correct binary — they CANNOT catch a CPU-only
          # build. bro.gpu.compiledBackends is the static build-time fact (read
          # from brotensor's own BROTENSOR_HAS_* defines — what it truly compiled),
          # so asserting the expected backend is present is what actually guards
          # against nightly regressing to CPU-only ML.
          if [ "${{ matrix.cuda }}" = "true" ]; then EXPECT=cuda; else EXPECT=metal; fi
          # bro-headless requires an app directory; use the bundled "blank"
          # skeleton (self-contained, no external repo). The probe throws — failing
          # the job — if bro.gpu is missing or the expected backend wasn't compiled
          # in; otherwise it prints the runtime backend (honestly 'cpu' here) and
          # the compiled-in set.
          APP=system/skeletons/blank
          PROBE="if(!bro.gpu||!bro.gpu.backend)throw new Error('bro.gpu backend missing');if(!(bro.gpu.compiledBackends||[]).includes('$EXPECT'))throw new Error('GPU backend $EXPECT NOT compiled in; compiledBackends='+JSON.stringify(bro.gpu.compiledBackends));console.log('backend='+bro.gpu.backend+' available='+bro.gpu.available+' compiledBackends='+JSON.stringify(bro.gpu.compiledBackends))"
          # GPU-headless renders through a hidden GL context — the same code that
          # ships. Linux gets a virtual display + software GL (xvfb + mesa-dri),
          # matching the CI job; macOS provides GL directly. The windows-2022
          # runner has no OpenGL 3.3, but the engine now detects that and falls
          # back to CPU raster (instead of crashing), so the probe runs uniformly
          # everywhere and this exercises that fallback path.
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$BH" "$APP" -e "$PROBE"
          else
            "$BH" "$APP" -e "$PROBE"
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "Windows" ]; then
            scripts/package-release.sh --version "$VERSION" --build-dir build --config Release
          else
            scripts/package-release.sh --version "$VERSION" --build-dir build
          fi

      # --- Windows code signing ---------------------------------------------
      # Signs the packaged tree before it is zipped, so what users download is
      # what was signed. Authenticode covers PE files only; the Linux and macOS
      # zips ship unsigned (macOS notarization needs an Apple Developer ID,
      # which is a separate thing entirely).
      #
      # No key or secret exists in this repo or on the runner. Auth is GitHub
      # OIDC federation against an Entra app whose federated credential only
      # trusts subject repo:wlejon/bro:ref:refs/heads/main, and the signing key
      # itself never leaves Azure's HSM — the action uploads a digest and gets a
      # signature back. The three AZURE_* values below are identifiers, not
      # credentials, which is why they are `vars` and not `secrets`.
      #
      # Timestamping is load-bearing, not optional: Artifact Signing issues
      # ~3-day certificates, so an untimestamped signature stops validating
      # almost immediately. The RFC3161 countersignature is what pins validity
      # to signing time and keeps old nightlies verifiable after rotation.
      - name: Resolve package directory (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          d=$(ls -d dist/bro-${VERSION}-* | head -1)
          # Absolute Windows path — the signing action is .NET and does not
          # understand MSYS-style /d/... paths.
          echo "PKG_DIR=$(cygpath -w "$(pwd)/$d")" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, no stored secret)
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://cus.codesigning.azure.net/
          signing-account-name: brosigning
          certificate-profile-name: broPublicTrust
          files-folder: ${{ env.PKG_DIR }}
          # The three executables plus the vcpkg DLLs loaded into our process.
          # Basic SKU allows 5,000 signatures/month; a nightly uses ~20.
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Fail the job rather than publish silently-unsigned binaries if the step
      # above ever soft-fails. Get-AuthenticodeSignature is used instead of
      # signtool because it is built into PowerShell and needs no SDK path hunt.
      - name: Verify signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = @()
          foreach ($exe in @('bro.exe','bro-headless.exe','bro-server.exe')) {
            $p = Join-Path $env:PKG_DIR $exe
            if (-not (Test-Path $p)) { Write-Host "MISSING $exe"; $bad += $exe; continue }
            $sig = Get-AuthenticodeSignature $p
            Write-Host "$exe -> $($sig.Status) | $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad += $exe }
          }
          if ($bad.Count) { throw "unsigned or invalid: $($bad -join ', ')" }

      - name: Zip
        shell: bash
        run: |
          cd dist
          d=$(ls -d bro-${VERSION}-* | head -1)
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${d}.zip" "$d" >/dev/null
          else
            zip -qr "../${d}.zip" "$d"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bro-${{ matrix.name }}
          path: bro-nightly-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rolling nightly
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7      # for the commit sha the release targets
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Re-point the single "nightly" tag/release at this run's commit and
      # replace its assets. Deleting first (with --cleanup-tag) is the reliable
      # way to move the tag.
      #
      # --latest is explicit and load-bearing: nightly is the only release bro
      # publishes right now, so it must be the one GitHub serves at
      # /releases/latest and shows at the top of the releases page. Without it
      # (or worse, with --prerelease, which is what this used to do) GitHub
      # falls back to "most recent non-prerelease" and picks whatever else
      # happens to exist — in practice the skia-prebuilt-m147 build artifact,
      # which is infrastructure and not something to hand a user.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          NOTES="Automated nightly build from \`${GITHUB_SHA::7}\` on $(date -u +%Y-%m-%d).

          Single self-contained binary per platform — uses your NVIDIA GPU when present, falls back to CPU otherwise (macOS uses Metal). bro is pre-alpha; nightly is the current release channel."
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --title "Nightly ($(date -u +%Y-%m-%d))" \
            --notes "$NOTES" \
            --latest \
            artifacts/*.zip
