name: CodeQL

# Static analysis for bro's OWN C++ (engine core, DOM/layout/render/canvas/WebGL,
# and the large src/js binding layer). The vendored siblings under third_party/
# each run their own CodeQL and own their Security tab, so they're excluded here.
#
# Build-mode: none (build-free extraction). This is deliberate: for a *built*
# C/C++ analysis, CodeQL extracts whatever the compiler touches and path filters
# have no effect — and bro can't be built without compiling the submodules it
# links (qjsbind, brokit, htmlayout, gumbo, …), so a traced build would always
# drag third_party/ into the results. Build-free extraction is the one mode where
# paths-ignore is honored for C/C++; it also needs no vcpkg/CUDA/X11 toolchain.
# Submodules aren't checked out, so there is nothing under third_party/ to scan.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      # No submodules: the siblings live in third_party/ and are analysed in
      # their own repositories. Leaving them unchecked-out means there is
      # nothing beneath third_party/ for the extractor to see.
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: none
          # Belt-and-suspenders with the missing submodule checkout above:
          # paths-ignore IS honored in build-mode none (unlike a traced build).
          config: |
            paths-ignore:
              - third_party

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
