name: CodeQL

# Static analysis for bro's OWN C++ (engine core, DOM/layout/render/canvas/WebGL,
# and the bronze host layer). The sibling libraries bro builds against each run
# their own CodeQL and own their Security tab, so they're excluded here.
#
# Build-mode: none (build-free extraction). This is deliberate: for a *built*
# C/C++ analysis, CodeQL extracts whatever the compiler touches and path filters
# have no effect — and bro can't be built without compiling the dependencies it
# links (bronze, brass, brokit, htmlayout, gumbo, …), so a traced build would always
# drag them into the results. Build-free extraction is the one mode where
# paths-ignore is honored for C/C++; it also needs no vcpkg/CUDA/X11 toolchain.
# Without a configure nothing is fetched, so only bro's own tree is scanned.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      # The dependencies are fetched by configure, which never runs here, so
      # the checkout holds bro's own sources and the vendored Skia glue only.
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          # Keeps the vendored Skia glue under third_party/ out of the results:
          # paths-ignore IS honored in build-mode none (unlike a traced build).
          config: |
            paths-ignore:
              - third_party

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
