name: CodeQL

# Static analysis for bro's own C++. Builds the minimal profile: it needs no
# vcpkg and no CUDA, so the trace is fast and reliable, while still covering the
# engine core, DOM/layout/render/canvas/WebGL, and the large src/js binding
# layer. third_party/ (the submodule siblings) is filtered out of the results —
# each sibling repo runs its own CodeQL and owns its Security tab.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          # Keep the analysis scoped to bro's own sources; the vendored siblings
          # are analysed in their own repositories.
          config: |
            paths-ignore:
              - third_party

      # -O0 keeps the extracted IR close to the source so alert dataflow paths
      # point at code a human can act on.
      - name: Build (minimal profile)
        run: |
          cmake -B build -DBRO_PROFILE=minimal -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
