# Linux build environment. Invoke via:
#   docker compose run --rm linux-build bash scripts/docker-build.sh
#
# Sibling repos (qjsbind, brokit, broaudio, bromesh, brogameagent) are
# mounted at /work/<name> so ../<name> from /work/bro resolves correctly.

services:
  linux-build:
    build:
      context: .
      dockerfile: docker/Dockerfile.linux-build
    image: bro-linux-build:ubuntu22
    working_dir: /work/bro
    volumes:
      - .:/work/bro
      - ../qjsbind:/work/qjsbind
      - ../brokit:/work/brokit
      - ../broaudio:/work/broaudio
      - ../bromesh:/work/bromesh
      - ../brogameagent:/work/brogameagent
      # Persist Skia source checkout + build output across container runs so
      # we don't re-download or rebuild Skia every time. These live outside
      # the repo mount so host Windows Skia doesn't collide.
      - skia-src:/work/bro/third_party/skia/src
      - skia-out:/work/bro/third_party/skia/src/out
    environment:
      # Surface the host's release version tag to the packaging script.
      RELEASE_VERSION: "${RELEASE_VERSION:-}"
    tty: true
    stdin_open: true

volumes:
  skia-src:
  skia-out:
