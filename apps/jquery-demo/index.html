<!DOCTYPE html>
<html>
<head>
    <title>jQuery Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <h1 id="title">jQuery Live Dashboard</h1>
            <div id="clock"></div>
        </header>

        <div id="grid">
            <div id="stats" class="panel">
                <h2>System Stats</h2>
                <div class="stat-row">
                    <span class="label">CPU</span>
                    <div class="bar-track"><div id="cpu-bar" class="bar"></div></div>
                    <span id="cpu-val" class="value">0%</span>
                </div>
                <div class="stat-row">
                    <span class="label">MEM</span>
                    <div class="bar-track"><div id="mem-bar" class="bar bar-mem"></div></div>
                    <span id="mem-val" class="value">0%</span>
                </div>
                <div class="stat-row">
                    <span class="label">NET</span>
                    <div class="bar-track"><div id="net-bar" class="bar bar-net"></div></div>
                    <span id="net-val" class="value">0%</span>
                </div>
                <div class="stat-row">
                    <span class="label">DISK</span>
                    <div class="bar-track"><div id="disk-bar" class="bar bar-disk"></div></div>
                    <span id="disk-val" class="value">0%</span>
                </div>
            </div>

            <div id="feed" class="panel">
                <h2>Live Feed</h2>
                <ul id="feed-list"></ul>
            </div>

            <div id="controls" class="panel">
                <h2>Controls</h2>
                <button id="btn-theme" class="btn">Toggle Theme</button>
                <button id="btn-pause" class="btn">Pause</button>
                <button id="btn-clear" class="btn">Clear Feed</button>
                <button id="btn-add" class="btn">Add Card</button>
                <button id="btn-sort" class="btn">Sort Cards</button>
                <button id="btn-shuffle" class="btn">Shuffle Cards</button>
                <div id="status" class="status-ok">Running</div>
            </div>

            <div id="cards" class="panel">
                <h2>Data Cards</h2>
                <div id="card-container"></div>
            </div>

            <div id="sparklines" class="panel">
                <h2>Trend Lines</h2>
                <div id="spark-cpu" class="sparkline"></div>
                <div id="spark-mem" class="sparkline"></div>
                <div id="spark-net" class="sparkline"></div>
            </div>

            <div id="todos" class="panel">
                <h2>Task List</h2>
                <div id="todo-input-row">
                    <button id="btn-add-todo" class="btn btn-sm">+ Add Task</button>
                    <span id="todo-count">0 tasks</span>
                </div>
                <ul id="todo-list"></ul>
            </div>
        </div>

        <footer id="footer">
            <span id="fps-display">0 fps</span>
            <span id="update-count">0 updates</span>
            <span id="jquery-version"></span>
        </footer>
    </div>

    <script src="jquery-3.7.1.slim.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
