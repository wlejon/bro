<!DOCTYPE html>
<html>
<head>
    <title>3D Scene Graph Demo</title>
    <style>
        html, body { margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.6);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 10;
        }
        #hud h2 { font-size: 16px; margin-bottom: 6px; color: #7bed9f; }
        #hud .key { color: #ffa502; font-weight: bold; }
        #info {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.6);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            z-index: 10;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: transparent; }
    </style>
</head>
<body>
    <div id="hud">
        <h2>3D Scene Graph Demo</h2>
        <div><span class="key">1</span> Solar system (hierarchy + Z rotation)</div>
        <div><span class="key">2</span> 3D axes (rotationX / rotationY / rotationZ)</div>
        <div><span class="key">3</span> Spiral tower (position.z + scale3D)</div>
        <div><span class="key">4</span> Physics sync (Jolt + scene graph)</div>
        <div><span class="key">Space</span> Pause / Resume</div>
    </div>
    <div id="info">Loading...</div>
    <canvas id="canvas"></canvas>
    <script src="app.js"></script>
</body>
</html>
