<!DOCTYPE html>
<html>
<head>
    <title>Solar System 3D</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; cursor: crosshair; width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 10px; left: 10px;
            color: #ccc; font: 13px monospace;
            background: rgba(0,0,0,0.7); padding: 10px 14px;
            border-radius: 6px; pointer-events: none;
            line-height: 1.5;
        }
        #hud b { color: #ffa502; }
        #hud .title { color: #7bed9f; font-size: 15px; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="hud">
        <div class="title">Solar System 3D</div>
        <b>WASD</b> Move &nbsp; <b>Space/Shift</b> Up/Down<br>
        <b>Mouse</b> Look (click to capture)<br>
        <b>M</b> Toggle audio &nbsp; <b>+/-</b> Volume<br>
        <div id="info"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
