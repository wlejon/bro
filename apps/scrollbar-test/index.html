<!DOCTYPE html>
<html>
<head>
    <title>Scrollbar Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  Test 1: overflow:hidden should NOT show a scrollbar.
  This box clips its content but the user cannot scroll it.
-->
<div id="hidden-box" class="box hidden-overflow">
    <div class="tall-content">overflow:hidden - no scrollbar expected</div>
</div>

<!--
  Test 2: overflow:auto SHOULD show a scrollbar when content overflows.
-->
<div id="auto-box" class="box auto-overflow">
    <div class="tall-content">overflow:auto - scrollbar expected</div>
</div>

<!--
  Test 3: overflow:scroll SHOULD always show a scrollbar.
-->
<div id="scroll-box" class="box scroll-overflow">
    <div class="tall-content">overflow:scroll - scrollbar expected</div>
</div>

<!--
  Test 4: Nested scrollable elements.
  The outer and inner both have overflow:auto with overflowing content.
  Scrolling the inner should NOT scroll the outer.
-->
<div id="outer-scroll" class="box auto-overflow nested-outer">
    <div class="filler">outer top</div>
    <div id="inner-scroll" class="box auto-overflow nested-inner">
        <div class="tall-content-small">inner content</div>
    </div>
    <div class="filler">outer bottom padding</div>
    <div class="filler">more outer content</div>
    <div class="filler">even more outer</div>
</div>

<!--
  Test 5: Shadow DOM with overflow:hidden on host, overflow:auto on slotted content.
  Mimics the game-ui pattern: host clips, but inner element scrolls.
-->
<shadow-container id="shadow-host">
    <div id="shadow-inner-scrollable" class="box auto-overflow" style="max-height: 120px;">
        <div class="tall-content-small">shadow slotted scrollable</div>
    </div>
</shadow-container>

<script src="app.js"></script>
</body>
</html>
