<!DOCTYPE html>
<html>
<head>
    <title>Mesh API Demo</title>
    <style>
        html, body { margin: 0; padding: 0; }
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
            z-index: 10;
        }
        #hud h2 { font-size: 16px; margin-bottom: 6px; color: #7bed9f; }
        #hud .key { color: #ffa502; font-weight: bold; }
        #hud .section { margin-top: 8px; color: #74b9ff; font-weight: bold; }
        #info {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            z-index: 10;
            max-width: 600px;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: transparent; }
    </style>
</head>
<body>
    <div id="hud">
        <h2>Mesh API Demo</h2>
        <div class="section">Scenes</div>
        <div><span class="key">1</span> Primitives gallery</div>
        <div><span class="key">2</span> Transforms + cloning</div>
        <div><span class="key">3</span> CSG booleans</div>
        <div><span class="key">4</span> Simplification + LOD</div>
        <div><span class="key">5</span> Subdivision + smoothing</div>
        <div><span class="key">6</span> Isosurface (marching cubes)</div>
        <div><span class="key">7</span> Analysis (bbox + raycast)</div>
        <div class="section">Controls</div>
        <div><span class="key">Space</span> Pause / Resume</div>
    </div>
    <div id="info">Loading...</div>
    <canvas id="canvas"></canvas>
    <script src="app.js"></script>
</body>
</html>
