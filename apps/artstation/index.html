<!DOCTYPE html>
<html>
<head>
    <title>Art Station</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <span id="title">Art Station</span>
        <span id="status">no asset loaded</span>
        <span id="watch-status"></span>
    </div>

    <!-- Asset picker: populated from assets/*.js when running windowed.
         Click a button to render+animate that asset live. -->
    <div id="picker"></div>

    <!-- Transport: play/pause + speed + animation selector. Drives the
         live preview AND the save (saveVideo/saveGif honor the same anim
         and speed so the export matches what's on screen). -->
    <div id="transport">
        <button id="play-toggle" title="Play / Pause">⏸</button>
        <label class="t-label">anim</label>
        <select id="anim-select"></select>
        <label class="t-label">speed</label>
        <span id="speed-buttons">
            <button class="speed-btn" data-speed="0.25">0.25×</button>
            <button class="speed-btn" data-speed="0.5">0.5×</button>
            <button class="speed-btn selected" data-speed="1">1×</button>
            <button class="speed-btn" data-speed="2">2×</button>
            <button class="speed-btn" data-speed="4">4×</button>
        </span>
        <span id="frame-counter"></span>
    </div>

    <!-- Save action bar: buttons enabled per asset kind. PNG always works
         once an asset is loaded; WebM/GIF only on animated or sheet kinds. -->
    <div id="save-bar">
        <button class="save-btn" data-action="png">save PNG</button>
        <button class="save-btn" data-action="webm">save WebM</button>
        <button class="save-btn" data-action="gif">save GIF</button>
        <span id="save-status"></span>
    </div>

    <div id="layout">
        <!-- Sheet canvas: pixel-perfect 1:1 size of the asset; this is what
             we screenshot-crop to produce the final PNG. -->
        <div id="sheet-wrap">
            <div class="label">SHEET (1:1)</div>
            <canvas id="sheet" width="32" height="32"></canvas>
        </div>

        <!-- Stage: scene-based animation preview to verify the produced
             spritesheet animates correctly when fed back into createSprite. -->
        <div id="stage-wrap">
            <div class="label">STAGE</div>
            <canvas id="stage" width="320" height="240"></canvas>
            <canvas id="stage-3d" width="320" height="240"></canvas>
        </div>

        <!-- Info pane shows asset manifest, palette, frame indices. -->
        <pre id="info">No asset loaded.

Click an asset above to render and preview it live.
Edits to assets/*.js hot-reload automatically.

From headless:
  load('hero')
  render()
  save('hero')
  preview('walk')</pre>
    </div>

    <script src="color.js"></script>
    <script src="brush.js"></script>
    <script src="app.js"></script>
    <script src="parts.js"></script>
</body>
</html>
