<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI Arena - brogameagent demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="left">
            <div id="arena-wrap">
                <canvas id="arena"></canvas>
            </div>
            <div id="log-wrap">
                <div id="log-title">DAMAGE LOG</div>
                <div id="log"></div>
            </div>
            <div id="controls">
                <div class="ctrl-group">
                    <span class="ctrl-label">SIM</span>
                    <button id="btn-pause">Pause</button>
                    <button id="btn-rewind">Rewind 2s</button>
                    <button id="btn-reset">Reset</button>
                </div>
                <div class="ctrl-group">
                    <span class="ctrl-label">REPLAY</span>
                    <button id="btn-record">Record</button>
                    <button id="btn-play">Play</button>
                </div>
                <div class="ctrl-group">
                    <span class="ctrl-label">Red AI</span>
                    <select id="sel-red-ai"></select>
                </div>
                <div class="ctrl-group">
                    <span class="ctrl-label">Blue AI</span>
                    <select id="sel-blue-ai"></select>
                </div>
                <div class="ctrl-group">
                    <span class="ctrl-label">Focus</span>
                    <select id="sel-focus"></select>
                </div>
            </div>
        </div>
        <div id="right">
            <div class="panel">
                <div class="panel-title">ROSTER</div>
                <div id="roster"></div>
            </div>
            <div class="panel">
                <div class="panel-title">AGENT STATS</div>
                <div id="agent-stats">--</div>
            </div>
            <div class="panel">
                <div class="panel-title">OBSERVATION (focused)</div>
                <canvas id="obs-canvas" width="320" height="70"></canvas>
            </div>
            <div class="panel">
                <div class="panel-title">ACTION MASK</div>
                <div id="mask-row"></div>
            </div>
            <div class="panel">
                <div class="panel-title">REWARD SCORE</div>
                <div id="reward-nums">Red 0.0 / Blue 0.0</div>
                <canvas id="reward-canvas" width="320" height="90"></canvas>
            </div>
            <div class="panel">
                <div class="panel-title">STATUS</div>
                <div id="status">ready</div>
            </div>
        </div>
    </div>
    <script src="../lib/bot_aim.js"></script>
    <script src="../lib/camera.js"></script>
    <script src="config.js"></script>
    <script src="scenarios.js"></script>
    <script src="arena.js"></script>
    <script src="ai.js"></script>
    <script src="bot.js"></script>
    <script src="options/tactical_options.js"></script>
    <script src="agents/registry.js"></script>
    <script src="agents/random.js"></script>
    <script src="agents/scripted.js"></script>
    <script src="agents/tactical.js"></script>
    <script src="agents/options_shared.js"></script>
    <script src="agents/options_mcts.js"></script>
    <script src="agents/options_commander.js"></script>
    <script src="render.js"></script>
    <script src="scene_setup.js"></script>
    <script src="ui.js"></script>
    <script src="replay.js"></script>
    <script src="loop.js"></script>
    <script src="controls.js"></script>
    <script src="main.js"></script>
</body>
</html>
