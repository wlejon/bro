<!DOCTYPE html>
<html>
<head>
    <title>Flora — procedural plant viewer</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0b0d10; overflow: hidden; }
        canvas#stage { display: block; width: 100vw; height: 100vh; }

        #panel {
            position: absolute;
            left: 12px; top: 12px; bottom: 12px;
            width: 290px;
            background: rgba(0,0,0,0.72);
            color: #d8e0e8;
            font: 12px system-ui, sans-serif;
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        #panel h1 { margin: 0 0 6px 0; font-size: 14px; color: #fff; }
        #panel h2 { margin: 10px 0 4px 0; font-size: 11px; color: #8aa0b0; text-transform: uppercase; letter-spacing: 0.06em; }

        .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
        .tab {
            flex: 1; padding: 4px 8px; text-align: center;
            background: #1c2229; color: #9aa6b3;
            border: 1px solid #2a323c; border-radius: 4px;
            cursor: pointer; font-size: 11px;
        }
        .tab.active { background: #2a3d52; color: #d8e0e8; border-color: #4a6480; }

        #params { flex: 1 1 auto; overflow-y: auto; padding-right: 4px; }
        #params::-webkit-scrollbar { width: 6px; }
        #params::-webkit-scrollbar-thumb { background: #2a323c; border-radius: 3px; }

        .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
        .row label { flex: 0 0 95px; color: #b8c4d0; font-size: 11px; }
        .row input[type=range] { flex: 1; }
        .row input[type=number],
        .row select {
            background: #111; color: #d8e0e8; border: 1px solid #333;
            padding: 1px 4px; font: 11px system-ui, sans-serif;
        }
        .row input[type=number] { width: 60px; }
        .row select { flex: 1; }
        .row .v { flex: 0 0 42px; color: #7bed9f; font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; }
        .row input[type=color] { width: 28px; height: 18px; border: 1px solid #333; padding: 0; background: #111; }

        .actions { display: flex; gap: 6px; margin-top: 6px; }
        .actions button {
            background: #1c2229; color: #d8e0e8; border: 1px solid #3a4452;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;
        }
        .actions button:hover { background: #28303a; }
        .actions button.primary { background: #2a4d6e; border-color: #4a7099; }
        .actions button.primary:hover { background: #355c80; }

        #stats { color: #7d8794; font-size: 10px; margin-top: 6px; min-height: 14px; }
        #help { color: #5d6774; font-size: 10px; margin-top: 4px; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div id="panel">
        <h1>Flora</h1>
        <div class="tabs">
            <div class="tab active" data-mode="single">Single</div>
            <div class="tab" data-mode="forest">Forest</div>
        </div>
        <div id="params"></div>
        <div class="actions">
            <button id="regen" class="primary">Regenerate</button>
            <button id="fit">Fit</button>
            <button id="reseed">New seed</button>
            <button id="reset">Reset</button>
        </div>
        <div id="stats">—</div>
        <div id="help">drag = orbit · shift+drag = pan · wheel = zoom</div>
    </div>
    <script src="recipes.js"></script>
    <script src="app.js"></script>
</body>
</html>
