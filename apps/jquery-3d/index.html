<!DOCTYPE html>
<html>
<head>
    <title>jQuery + Three.js Combined Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="c" width="1024" height="768"></canvas>

    <div id="hud">
        <div id="hud-title">jQuery + Three.js</div>
        <div id="metrics">
            <div class="metric">
                <span class="metric-label">CPU</span>
                <div class="bar-track"><div id="cpu-bar" class="bar"></div></div>
                <span id="cpu-val" class="metric-val">0%</span>
            </div>
            <div class="metric">
                <span class="metric-label">MEM</span>
                <div class="bar-track"><div id="mem-bar" class="bar bar-blue"></div></div>
                <span id="mem-val" class="metric-val">0%</span>
            </div>
        </div>
        <div id="info"></div>
        <div id="feed"></div>
    </div>

    <script src="three.min.js"></script>
    <script src="jquery-3.7.1.slim.min.js"></script>
    <script src="scene.js"></script>
    <script src="hud.js"></script>
</body>
</html>
