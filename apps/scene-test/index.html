<!DOCTYPE html>
<html>
<head><style>html,body{margin:0;background:#222;}</style></head>
<body>
<canvas id="c" style="display:block;width:100vw;height:100vh;"></canvas>
<script>
var c = document.getElementById('c');
console.log('canvas element:', c ? 'found' : 'null');
var scene = c.getContext('scene');
console.log('scene context:', scene ? 'got it' : 'null');

// Create a single bright red rectangle
var rect = scene.createShape({
    shape: 'rect', width: 200, height: 200,
    fill: 'red', x: 400, y: 300
});
console.log('rect node:', rect ? 'created (id=' + rect.id + ')' : 'null');
console.log('scene graph renders automatically each frame');
</script>
</body>
</html>
