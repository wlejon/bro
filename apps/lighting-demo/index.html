<!DOCTYPE html>
<html>
<head>
    <title>Lighting Demo</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        canvas#stage { display: block; width: 100vw; height: 100vh; }

        #hud {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            color: #cfe;
            font: 12px system-ui, sans-serif;
            padding: 10px 14px;
            border-radius: 6px;
            min-width: 220px;
        }
        #hud h1 { margin: 0 0 6px 0; font-size: 13px; color: #fff; }
        #hud label { display: block; margin: 3px 0; }
        #hud input[type=range] { width: 140px; vertical-align: middle; }
        #hud span.v { color: #7bed9f; display: inline-block; min-width: 36px; text-align: right; }
        #hud select { background: #111; color: #cfe; border: 1px solid #333; padding: 1px 3px; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div id="hud">
        <h1>PBR Lighting Demo</h1>
        <label>Tonemap:
            <select id="mode">
                <option value="aces" selected>ACES</option>
                <option value="reinhard">Reinhard</option>
                <option value="linear">Linear</option>
            </select>
        </label>
        <label>Exposure: <input id="exposure" type="range" min="0.2" max="3.0" step="0.05" value="1.0">
            <span class="v" id="exposureVal">1.00</span></label>
        <label>Sun intensity: <input id="sun" type="range" min="0" max="8" step="0.1" value="3.0">
            <span class="v" id="sunVal">3.0</span></label>
        <label>Ambient: <input id="ambient" type="range" min="0" max="0.2" step="0.005" value="0.03">
            <span class="v" id="ambientVal">0.03</span></label>
        <label>Environment: <span id="envStatus" style="font-size:10px"></span>
            <select id="hdri">
                <option value="">— none (flat ambient) —</option>
                <option value="venice_sunset">Venice sunset</option>
                <option value="kiara_1_dawn">Kiara dawn (savanna)</option>
                <option value="spruit_sunrise">Spruit sunrise</option>
                <option value="kloppenheim_06_puresky">Kloppenheim sky</option>
                <option value="kloofendal_43d_clear_puresky">Kloofendal clear sky</option>
                <option value="qwantani_puresky">Qwantani lake sky</option>
                <option value="belfast_sunset_puresky">Belfast sunset sky</option>
                <option value="the_sky_is_on_fire">Sky on fire</option>
                <option value="moonless_golf">Moonless golf</option>
                <option value="dikhololo_night">Dikhololo night (stars)</option>
                <option value="snowy_forest_path_01">Snowy forest path</option>
                <option value="spiaggia_di_mondello">Mondello beach</option>
            </select>
        </label>
        <label>IBL intensity: <input id="iblIntensity" type="range" min="0" max="3" step="0.05" value="1.0">
            <span class="v" id="iblIntensityVal">1.00</span></label>
        <label>IBL rotation: <input id="iblRotation" type="range" min="0" max="6.283" step="0.05" value="0">
            <span class="v" id="iblRotationVal">0.00</span></label>
        <label><input type="checkbox" id="showIcons" checked> Show light icons</label>
        <label><input type="checkbox" id="animate" checked> Animate lights</label>
        <label><input type="checkbox" id="shadows"> Sun shadow</label>
        <div id="selInfo" style="margin-top:6px; color:#fd9; font-size:11px; min-height:16px;">
            Click a light icon to select.
        </div>
        <div style="margin-top:8px; color:#888; font-size:11px;">
            Front row: dielectric, roughness sweep.<br>
            Back row: metal, roughness sweep.<br>
            Left-click light icons to select + gizmo.<br>
            <b>Right-drag</b>: orbit · <b>Middle-drag</b>: pan · <b>Wheel</b>: zoom
        </div>
    </div>
    <script src="../lib/camera.js"></script>
    <script src="app.js"></script>
</body>
</html>
