<!DOCTYPE html>
<html>
<head>
    <title>SVG Primitives Test</title>
    <style>
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #e94560;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
        }
        .card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 12px;
            margin: 8px;
            width: 220px;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #e94560;
        }
    </style>
</head>
<body>
    <h1>SVG Primitives Test Grid</h1>
    <div class="grid">

        <div class="card">
            <h3>Rectangle</h3>
            <svg width="200" height="80">
                <rect x="10" y="10" width="180" height="60"
                      fill="steelblue" stroke="white" stroke-width="2"/>
            </svg>
        </div>

        <div class="card">
            <h3>Rounded Rect</h3>
            <svg width="200" height="80">
                <rect x="10" y="10" width="180" height="60"
                      rx="15" ry="15"
                      fill="coral" stroke="white" stroke-width="2"/>
            </svg>
        </div>

        <div class="card">
            <h3>Circle</h3>
            <svg width="200" height="100">
                <circle cx="100" cy="50" r="40"
                        fill="gold" stroke="orange" stroke-width="3"/>
            </svg>
        </div>

        <div class="card">
            <h3>Ellipse</h3>
            <svg width="200" height="100">
                <ellipse cx="100" cy="50" rx="80" ry="35"
                         fill="mediumblue" stroke="lightblue" stroke-width="2"/>
            </svg>
        </div>

        <div class="card">
            <h3>Line</h3>
            <svg width="200" height="80">
                <line x1="10" y1="70" x2="190" y2="10"
                      stroke="lime" stroke-width="3"/>
                <line x1="10" y1="10" x2="190" y2="70"
                      stroke="cyan" stroke-width="3"/>
            </svg>
        </div>

        <div class="card">
            <h3>Polyline</h3>
            <svg width="200" height="80">
                <polyline points="10,70 50,10 90,50 130,20 170,60 190,30"
                          fill="none" stroke="yellow" stroke-width="2"/>
            </svg>
        </div>

        <div class="card">
            <h3>Polygon (Star)</h3>
            <svg width="200" height="100">
                <polygon points="100,5 120,40 160,40 130,62 140,95 100,75 60,95 70,62 40,40 80,40"
                         fill="crimson" stroke="white" stroke-width="1"/>
            </svg>
        </div>

        <div class="card">
            <h3>Path (Heart)</h3>
            <svg width="200" height="100" viewBox="0 0 200 100">
                <path d="M100,80 C60,100 0,60 10,30 C20,0 50,0 60,15
                         C70,30 80,40 100,50
                         C120,40 130,30 140,15
                         C150,0 180,0 190,30
                         C200,60 140,100 100,80 Z"
                      fill="deeppink" stroke="white" stroke-width="1"/>
            </svg>
        </div>

        <div class="card">
            <h3>Path (Bezier)</h3>
            <svg width="200" height="80">
                <path d="M10,70 C40,10 80,10 100,40 S160,70 190,10"
                      fill="none" stroke="orchid" stroke-width="3"/>
            </svg>
        </div>

        <div class="card">
            <h3>Text</h3>
            <svg width="200" height="60">
                <text x="10" y="35" font-size="24" fill="white">Hello SVG!</text>
            </svg>
        </div>

        <div class="card">
            <h3>Group (transform)</h3>
            <svg width="200" height="100">
                <g fill="forestgreen" stroke="white" stroke-width="1">
                    <rect x="10" y="10" width="50" height="80"/>
                    <rect x="70" y="10" width="50" height="80"/>
                    <rect x="130" y="10" width="50" height="80"/>
                </g>
            </svg>
        </div>

        <div class="card">
            <h3>ViewBox Scaling</h3>
            <svg width="200" height="100" viewBox="0 0 400 200">
                <circle cx="100" cy="100" r="80" fill="purple" stroke="violet" stroke-width="4"/>
                <circle cx="300" cy="100" r="80" fill="teal" stroke="aqua" stroke-width="4"/>
            </svg>
        </div>

        <div class="card">
            <h3>Multiple Shapes</h3>
            <svg width="200" height="100">
                <rect x="5" y="5" width="60" height="90" fill="darkred" rx="5"/>
                <circle cx="130" cy="50" r="35" fill="darkgreen"/>
                <polygon points="170,10 200,50 170,90" fill="darkblue"/>
            </svg>
        </div>

        <div class="card">
            <h3>Opacity</h3>
            <svg width="200" height="100">
                <circle cx="70" cy="50" r="40" fill="red" opacity="0.5"/>
                <circle cx="130" cy="50" r="40" fill="blue" opacity="0.5"/>
                <circle cx="100" cy="50" r="40" fill="green" opacity="0.5"/>
            </svg>
        </div>

    </div>
</body>
</html>
