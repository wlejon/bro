<!DOCTYPE html>
<html>
<head>
    <title>Synth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Row 1: Core controls -->
        <div id="header">
            <h1>SYNTH</h1>
            <div id="controls">
                <div class="control-group">
                    <label>Wave</label>
                    <div id="wave-btns" class="btn-group">
                        <button class="btn active" data-wave="sine">Sin</button>
                        <button class="btn" data-wave="square">Sqr</button>
                        <button class="btn" data-wave="sawtooth">Saw</button>
                        <button class="btn" data-wave="triangle">Tri</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Vol</label>
                    <input type="range" id="volume" min="0" max="100" value="30">
                </div>
                <div class="control-group">
                    <label>Preset</label>
                    <select id="preset-select"></select>
                    <button id="preset-save" class="btn">Save</button>
                </div>
                <div class="control-group mic-group">
                    <button id="mic-toggle" class="btn mic-btn mic-off">MIC</button>
                    <div id="mic-level-wrap"><div id="mic-level-bar"></div></div>
                    <label>Mon</label>
                    <input type="range" id="mic-volume" min="0" max="100" value="50">
                </div>
            </div>
        </div>

        <!-- Row 2: ADSR + Filter + Delay -->
        <div id="param-row">
            <div class="param-section">
                <label class="section-label">ADSR</label>
                <div class="param-controls">
                    <div class="param"><label>A</label><input type="range" id="adsr-a" min="1" max="2000" value="10"></div>
                    <div class="param"><label>D</label><input type="range" id="adsr-d" min="1" max="2000" value="100"></div>
                    <div class="param"><label>S</label><input type="range" id="adsr-s" min="0" max="100" value="100"></div>
                    <div class="param"><label>R</label><input type="range" id="adsr-r" min="1" max="3000" value="40"></div>
                </div>
            </div>
            <div class="param-section">
                <div class="section-header">
                    <label class="section-label">Filter</label>
                    <button id="filter-toggle" class="btn btn-sm">On</button>
                </div>
                <div class="param-controls">
                    <div id="filter-type-btns" class="btn-group">
                        <button class="btn active" data-type="lowpass">LP</button>
                        <button class="btn" data-type="highpass">HP</button>
                        <button class="btn" data-type="bandpass">BP</button>
                        <button class="btn" data-type="notch">NT</button>
                    </div>
                    <div class="param"><label>Cut</label><input type="range" id="filter-cutoff" min="0" max="100" value="50"></div>
                    <div class="param"><label>Q</label><input type="range" id="filter-q" min="1" max="200" value="10"></div>
                </div>
            </div>
            <div class="param-section">
                <div class="section-header">
                    <label class="section-label">Delay</label>
                    <button id="delay-toggle" class="btn btn-sm">On</button>
                </div>
                <div class="param-controls">
                    <div class="param"><label>Time</label><input type="range" id="delay-time" min="10" max="1500" value="300"></div>
                    <div class="param"><label>Fdbk</label><input type="range" id="delay-feedback" min="0" max="90" value="30"></div>
                    <div class="param"><label>Mix</label><input type="range" id="delay-mix" min="0" max="100" value="30"></div>
                </div>
            </div>
            <div class="param-section">
                <div class="section-header">
                    <label class="section-label">LFO</label>
                    <button id="lfo-toggle" class="btn btn-sm">On</button>
                </div>
                <div class="param-controls">
                    <div class="param"><label>Rate</label><input type="range" id="lfo-rate" min="1" max="200" value="50"></div>
                    <div class="param"><label>Dep</label><input type="range" id="lfo-depth" min="0" max="100" value="50"></div>
                    <div id="lfo-target-btns" class="btn-group">
                        <button class="btn active" data-target="pitch">Pit</button>
                        <button class="btn" data-target="filter">Flt</button>
                        <button class="btn" data-target="volume">Vol</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Visualization -->
        <canvas id="viz"></canvas>

        <!-- Sequencer -->
        <div id="seq-bar">
            <div id="seq-controls">
                <button id="seq-play" class="btn">Play</button>
                <div class="param"><label>BPM</label><input type="range" id="seq-bpm" min="30" max="300" value="120"><span id="seq-bpm-display">120</span></div>
                <div id="seq-mode-btns" class="btn-group">
                    <button class="btn active" data-mode="sequencer">Seq</button>
                    <button class="btn" data-mode="arpeggiator">Arp</button>
                </div>
                <div id="arp-pattern-btns" class="btn-group">
                    <button class="btn active" data-pattern="up">Up</button>
                    <button class="btn" data-pattern="down">Dn</button>
                    <button class="btn" data-pattern="updown">U/D</button>
                    <button class="btn" data-pattern="random">Rnd</button>
                </div>
            </div>
            <div id="seq-grid"></div>
        </div>

        <!-- Piano keyboard -->
        <div id="keyboard-wrap">
            <div id="keyboard"></div>
            <div id="octave-indicator">
                <span class="octave-hint">Shift+Tab</span>
                <span id="octave-display">C3</span>
                <span class="octave-hint">Tab</span>
            </div>
        </div>

        <!-- Status bar -->
        <div id="status-bar">
            <span id="note-display">--</span>
            <span id="freq-display">-- Hz</span>
            <span id="mic-note">Mic: --</span>
            <span id="mic-freq">-- Hz</span>
            <span id="fps-display">-- fps</span>
        </div>
    </div>

    <script src="lib/synth-engine.js"></script>
    <script src="lib/keyboard.js"></script>
    <script src="lib/visualizer.js"></script>
    <script src="lib/filter.js"></script>
    <script src="lib/effects.js"></script>
    <script src="lib/lfo.js"></script>
    <script src="lib/presets.js"></script>
    <script src="lib/sequencer.js"></script>
    <script src="app.js"></script>
</body>
</html>
