<!DOCTYPE html>
<html>
<head>
    <title>Synth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Top bar -->
        <div id="header">
            <h1>SYNTH</h1>
            <div id="controls">
                <div class="control-group">
                    <div id="wave-btns" class="btn-group">
                        <button class="btn active" data-wave="sine">Sin</button>
                        <button class="btn" data-wave="square">Sqr</button>
                        <button class="btn" data-wave="sawtooth">Saw</button>
                        <button class="btn" data-wave="triangle">Tri</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Preset</label>
                    <select id="preset-select"></select>
                    <button id="preset-save" class="btn">Save</button>
                </div>
                <div class="control-group">
                    <label>Vol</label>
                    <input type="range" id="volume" min="0" max="100" value="50">
                </div>
                <div class="control-group mic-group">
                    <button id="mic-toggle" class="btn mic-btn mic-off">MIC</button>
                    <div id="mic-level-wrap"><div id="mic-level-bar"></div></div>
                    <input type="range" id="mic-volume" min="0" max="100" value="50">
                </div>
            </div>
        </div>

        <!-- Main area: sidebar + viz -->
        <div id="main">
            <div id="sidebar">
                <!-- ADSR -->
                <div class="panel">
                    <div class="panel-title">ADSR</div>
                    <div class="slider-row"><label>Attack</label><input type="range" id="adsr-a" min="1" max="2000" value="10"><span class="slider-val" id="adsr-a-val">10ms</span></div>
                    <div class="slider-row"><label>Decay</label><input type="range" id="adsr-d" min="1" max="2000" value="100"><span class="slider-val" id="adsr-d-val">100ms</span></div>
                    <div class="slider-row"><label>Sustain</label><input type="range" id="adsr-s" min="0" max="100" value="100"><span class="slider-val" id="adsr-s-val">100%</span></div>
                    <div class="slider-row"><label>Release</label><input type="range" id="adsr-r" min="1" max="3000" value="80"><span class="slider-val" id="adsr-r-val">80ms</span></div>
                </div>

                <!-- Filter -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Filter</div>
                        <button id="filter-toggle" class="btn btn-toggle">Off</button>
                    </div>
                    <div id="filter-type-btns" class="btn-group full-width">
                        <button class="btn active" data-type="lowpass">LP</button>
                        <button class="btn" data-type="highpass">HP</button>
                        <button class="btn" data-type="bandpass">BP</button>
                        <button class="btn" data-type="notch">Notch</button>
                    </div>
                    <div class="slider-row"><label>Cutoff</label><input type="range" id="filter-cutoff" min="0" max="100" value="50"><span class="slider-val" id="filter-cutoff-val">1kHz</span></div>
                    <div class="slider-row"><label>Resonance</label><input type="range" id="filter-q" min="1" max="200" value="10"><span class="slider-val" id="filter-q-val">1.0</span></div>
                </div>

                <!-- Delay -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">Delay</div>
                        <button id="delay-toggle" class="btn btn-toggle">Off</button>
                    </div>
                    <div class="slider-row"><label>Time</label><input type="range" id="delay-time" min="10" max="1500" value="300"><span class="slider-val" id="delay-time-val">300ms</span></div>
                    <div class="slider-row"><label>Feedback</label><input type="range" id="delay-feedback" min="0" max="90" value="30"><span class="slider-val" id="delay-fb-val">30%</span></div>
                    <div class="slider-row"><label>Mix</label><input type="range" id="delay-mix" min="0" max="100" value="30"><span class="slider-val" id="delay-mix-val">30%</span></div>
                </div>

                <!-- LFO -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">LFO</div>
                        <button id="lfo-toggle" class="btn btn-toggle">Off</button>
                    </div>
                    <div class="slider-row"><label>Rate</label><input type="range" id="lfo-rate" min="0" max="100" value="30"><span class="slider-val" id="lfo-rate-val">2.0Hz</span></div>
                    <div class="slider-row"><label>Depth</label><input type="range" id="lfo-depth" min="0" max="100" value="30"><span class="slider-val" id="lfo-depth-val">30%</span></div>
                    <div id="lfo-target-btns" class="btn-group full-width">
                        <button class="btn active" data-target="pitch">Pitch</button>
                        <button class="btn" data-target="filter">Filter</button>
                        <button class="btn" data-target="volume">Volume</button>
                    </div>
                </div>
            </div>

            <div id="viz-area">
                <canvas id="viz"></canvas>
            </div>
        </div>

        <!-- Sequencer -->
        <div id="seq-bar">
            <div id="seq-controls">
                <button id="seq-play" class="btn">Play</button>
                <div class="seq-param"><label>BPM</label><input type="range" id="seq-bpm" min="30" max="300" value="120"><span id="seq-bpm-display">120</span></div>
                <div id="seq-mode-btns" class="btn-group">
                    <button class="btn active" data-mode="sequencer">Seq</button>
                    <button class="btn" data-mode="arpeggiator">Arp</button>
                </div>
                <div id="arp-pattern-btns" class="btn-group">
                    <button class="btn active" data-pattern="up">Up</button>
                    <button class="btn" data-pattern="down">Dn</button>
                    <button class="btn" data-pattern="updown">U/D</button>
                    <button class="btn" data-pattern="random">Rnd</button>
                </div>
            </div>
            <div id="seq-grid"></div>
        </div>

        <!-- Piano keyboard -->
        <div id="keyboard-wrap">
            <div id="keyboard"></div>
            <div id="octave-indicator">
                <span class="octave-hint">Shift+Tab</span>
                <span id="octave-display">C3</span>
                <span class="octave-hint">Tab</span>
            </div>
        </div>

        <!-- Status bar -->
        <div id="status-bar">
            <span id="note-display">--</span>
            <span id="freq-display">-- Hz</span>
            <span id="mic-note">Mic: --</span>
            <span id="mic-freq">-- Hz</span>
            <span id="fps-display">-- fps</span>
        </div>
    </div>

    <script src="lib/synth-engine.js"></script>
    <script src="lib/keyboard.js"></script>
    <script src="lib/visualizer.js"></script>
    <script src="lib/filter.js"></script>
    <script src="lib/effects.js"></script>
    <script src="lib/lfo.js"></script>
    <script src="lib/presets.js"></script>
    <script src="lib/sequencer.js"></script>
    <script src="app.js"></script>
</body>
</html>
