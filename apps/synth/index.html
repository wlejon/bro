<!DOCTYPE html>
<html>
<head>
    <title>Synth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Top bar -->
        <div id="header">
            <h1>SYNTH</h1>
            <div id="view-tabs" class="btn-group">
                <button class="btn active" data-view="synth">Synth</button>
                <button class="btn" data-view="editor">Clip Editor</button>
            </div>
            <div id="controls">
                <div class="control-group">
                    <label>Preset</label>
                    <select id="preset-select"></select>
                    <button id="preset-save" class="btn">Save</button>
                </div>
                <div class="control-group">
                    <label>Vol</label>
                    <input type="range" id="volume" min="0" max="100" value="50">
                </div>
                <div class="control-group mic-group">
                    <button id="mic-toggle" class="btn mic-btn mic-off">MIC</button>
                    <div id="mic-level-wrap"><div id="mic-level-bar"></div></div>
                    <input type="range" id="mic-volume" min="0" max="100" value="50">
                </div>
            </div>
        </div>

        <!-- ============================================================= -->
        <!-- SYNTH VIEW -->
        <!-- ============================================================= -->
        <div id="synth-view" style="display:flex">
            <!-- Main area: sidebar + viz -->
            <div id="main">
                <div id="sidebar">
                    <!-- Layer indicator -->
                    <div id="layer-indicator">
                        <span id="layer-indicator-color"></span>
                        <span id="layer-indicator-name">Layer 1</span>
                    </div>

                    <!-- Waveform + Pan -->
                    <div class="panel">
                        <div class="panel-title">Waveform</div>
                        <div id="wave-btns" class="btn-group full-width">
                            <button class="btn active" data-wave="sine">Sin</button>
                            <button class="btn" data-wave="square">Sqr</button>
                            <button class="btn" data-wave="sawtooth">Saw</button>
                            <button class="btn" data-wave="triangle">Tri</button>
                            <button class="btn" data-wave="whitenoise">Wht</button>
                            <button class="btn" data-wave="pinknoise">Pnk</button>
                        </div>
                        <div class="slider-row"><label>Pan</label><div class="fancy-slider" id="pan-slider"></div></div>
                    </div>

                    <!-- Unison -->
                    <div class="panel">
                        <div class="panel-title">Unison</div>
                        <div class="slider-row"><label>Voices</label><div class="fancy-slider" id="unison-count-slider"></div></div>
                        <div class="slider-row"><label>Detune</label><div class="fancy-slider" id="unison-detune-slider"></div></div>
                        <div class="slider-row"><label>Spread</label><div class="fancy-slider" id="unison-width-slider"></div></div>
                    </div>

                    <!-- ADSR -->
                    <div class="panel">
                        <div class="panel-title">ADSR</div>
                        <div class="slider-row"><label>Attack</label><div class="fancy-slider" id="adsr-a-slider"></div></div>
                        <div class="slider-row"><label>Decay</label><div class="fancy-slider" id="adsr-d-slider"></div></div>
                        <div class="slider-row"><label>Sustain</label><div class="fancy-slider" id="adsr-s-slider"></div></div>
                        <div class="slider-row"><label>Release</label><div class="fancy-slider" id="adsr-r-slider"></div></div>
                    </div>

                    <!-- Filter -->
                    <div class="panel panel-collapsible collapsed" id="panel-filter">
                        <div class="panel-header" data-panel="panel-filter">
                            <div class="panel-title">Filter</div>
                            <button id="filter-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div id="filter-type-btns" class="btn-group full-width">
                                <button class="btn active" data-type="lowpass">LP</button>
                                <button class="btn" data-type="highpass">HP</button>
                                <button class="btn" data-type="bandpass">BP</button>
                                <button class="btn" data-type="notch">Notch</button>
                            </div>
                            <div class="slider-row"><label>Cutoff</label><div class="fancy-slider" id="filter-cutoff-slider"></div></div>
                            <div class="slider-row"><label>Resonance</label><div class="fancy-slider" id="filter-q-slider"></div></div>
                        </div>
                    </div>

                    <!-- Delay -->
                    <div class="panel panel-collapsible collapsed" id="panel-delay">
                        <div class="panel-header" data-panel="panel-delay">
                            <div class="panel-title">Delay</div>
                            <button id="delay-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div class="slider-row"><label>Time</label><div class="fancy-slider" id="delay-time-slider"></div></div>
                            <div class="slider-row"><label>Feedback</label><div class="fancy-slider" id="delay-fb-slider"></div></div>
                            <div class="slider-row"><label>Mix</label><div class="fancy-slider" id="delay-mix-slider"></div></div>
                        </div>
                    </div>

                    <!-- Reverb -->
                    <div class="panel panel-collapsible collapsed" id="panel-reverb">
                        <div class="panel-header" data-panel="panel-reverb">
                            <div class="panel-title">Reverb</div>
                            <button id="reverb-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div class="slider-row"><label>Room</label><div class="fancy-slider" id="reverb-room-slider"></div></div>
                            <div class="slider-row"><label>Damping</label><div class="fancy-slider" id="reverb-damp-slider"></div></div>
                            <div class="slider-row"><label>Mix</label><div class="fancy-slider" id="reverb-mix-slider"></div></div>
                        </div>
                    </div>

                    <!-- Chorus -->
                    <div class="panel panel-collapsible collapsed" id="panel-chorus">
                        <div class="panel-header" data-panel="panel-chorus">
                            <div class="panel-title">Chorus</div>
                            <button id="chorus-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div class="slider-row"><label>Rate</label><div class="fancy-slider" id="chorus-rate-slider"></div></div>
                            <div class="slider-row"><label>Depth</label><div class="fancy-slider" id="chorus-depth-slider"></div></div>
                            <div class="slider-row"><label>Mix</label><div class="fancy-slider" id="chorus-mix-slider"></div></div>
                        </div>
                    </div>

                    <!-- Compressor -->
                    <div class="panel panel-collapsible collapsed" id="panel-compressor">
                        <div class="panel-header" data-panel="panel-compressor">
                            <div class="panel-title">Compressor</div>
                            <button id="comp-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div class="slider-row"><label>Thresh</label><div class="fancy-slider" id="comp-thresh-slider"></div></div>
                            <div class="slider-row"><label>Ratio</label><div class="fancy-slider" id="comp-ratio-slider"></div></div>
                            <div class="slider-row"><label>Sidechain</label><select id="comp-sidechain-select" class="sidebar-select"><option value="-1">Self</option></select></div>
                        </div>
                    </div>

                    <!-- Equalizer -->
                    <div class="panel panel-collapsible collapsed" id="panel-eq">
                        <div class="panel-header" data-panel="panel-eq">
                            <div class="panel-title">Equalizer</div>
                            <button id="eq-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div class="slider-row"><label>60Hz</label><div class="fancy-slider" id="eq-band0-slider"></div></div>
                            <div class="slider-row"><label>170Hz</label><div class="fancy-slider" id="eq-band1-slider"></div></div>
                            <div class="slider-row"><label>350Hz</label><div class="fancy-slider" id="eq-band2-slider"></div></div>
                            <div class="slider-row"><label>1kHz</label><div class="fancy-slider" id="eq-band3-slider"></div></div>
                            <div class="slider-row"><label>3.5kHz</label><div class="fancy-slider" id="eq-band4-slider"></div></div>
                            <div class="slider-row"><label>10kHz</label><div class="fancy-slider" id="eq-band5-slider"></div></div>
                            <div class="slider-row"><label>16kHz</label><div class="fancy-slider" id="eq-band6-slider"></div></div>
                            <div class="slider-row"><label>Master</label><div class="fancy-slider" id="eq-master-slider"></div></div>
                        </div>
                    </div>

                    <!-- Distortion -->
                    <div class="panel panel-collapsible collapsed" id="panel-distortion">
                        <div class="panel-header" data-panel="panel-distortion">
                            <div class="panel-title">Distortion</div>
                            <button id="dist-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div id="dist-mode-btns" class="btn-group full-width">
                                <button class="btn active" data-mode="softclip">Soft</button>
                                <button class="btn" data-mode="hardclip">Hard</button>
                                <button class="btn" data-mode="foldback">Fold</button>
                                <button class="btn" data-mode="bitcrush">Crush</button>
                            </div>
                            <div class="slider-row"><label>Drive</label><div class="fancy-slider" id="dist-drive-slider"></div></div>
                            <div class="slider-row"><label>Mix</label><div class="fancy-slider" id="dist-mix-slider"></div></div>
                            <div class="slider-row"><label>Output</label><div class="fancy-slider" id="dist-output-slider"></div></div>
                            <div class="slider-row"><label>Bits</label><div class="fancy-slider" id="dist-bits-slider"></div></div>
                            <div class="slider-row"><label>Rate</label><div class="fancy-slider" id="dist-rate-slider"></div></div>
                        </div>
                    </div>

                    <!-- LFO -->
                    <div class="panel panel-collapsible collapsed" id="panel-lfo">
                        <div class="panel-header" data-panel="panel-lfo">
                            <div class="panel-title">LFO</div>
                            <button id="lfo-toggle" class="btn btn-toggle">Off</button>
                        </div>
                        <div class="panel-body">
                            <div class="slider-row"><label>Rate</label><div class="fancy-slider" id="lfo-rate-slider"></div></div>
                            <div class="slider-row"><label>Depth</label><div class="fancy-slider" id="lfo-depth-slider"></div></div>
                            <div id="lfo-target-btns" class="btn-group full-width">
                                <button class="btn active" data-target="pitch">Pitch</button>
                                <button class="btn" data-target="filter">Filter</button>
                                <button class="btn" data-target="volume">Volume</button>
                                <button class="btn" data-target="pan">Pan</button>
                            </div>
                        </div>
                    </div>

                    <!-- Effect Order -->
                    <div class="panel panel-collapsible collapsed" id="panel-effect-order">
                        <div class="panel-header" data-panel="panel-effect-order">
                            <div class="panel-title">Effect Order</div>
                        </div>
                        <div class="panel-body">
                            <div id="effect-order-list" class="effect-order-list"></div>
                        </div>
                    </div>
                </div>

                <div id="viz-area">
                    <div id="viz-stack"></div>
                </div>
            </div>

            <!-- Sequencer area -->
            <div id="seq-area">
                <div id="seq-controls">
                    <div id="seq-controls-left">
                        <button id="seq-play" class="btn seq-transport-btn">Play</button>
                        <button id="seq-record" class="btn btn-record">Rec</button>
                        <div class="toolbar-sep"></div>
                        <div class="seq-param"><label>BPM</label><input type="range" id="seq-bpm" min="30" max="300" value="120"><span id="seq-bpm-display">120</span></div>
                        <div class="toolbar-sep"></div>
                        <div id="seq-mode-btns" class="btn-group">
                            <button class="btn active" data-mode="sequencer">Seq</button>
                            <button class="btn" data-mode="arpeggiator">Arp</button>
                        </div>
                        <div id="arp-pattern-btns" class="btn-group">
                            <button class="btn active" data-pattern="up">Up</button>
                            <button class="btn" data-pattern="down">Dn</button>
                            <button class="btn" data-pattern="updown">U/D</button>
                            <button class="btn" data-pattern="random">Rnd</button>
                        </div>
                    </div>
                    <div id="seq-controls-right">
                        <button id="seq-save-loop" class="btn btn-accent">Save Loop</button>
                        <button id="layer-add" class="btn btn-accent">+ Layer</button>
                    </div>
                </div>
                <div id="seq-layers"></div>
            </div>
        </div>

        <!-- ============================================================= -->
        <!-- CLIP EDITOR VIEW -->
        <!-- ============================================================= -->
        <div id="editor-view" style="display:none">
            <!-- Editor toolbar -->
            <div id="editor-toolbar">
                <div class="toolbar-group">
                    <button id="ed-record" class="btn btn-record">Rec</button>
                    <button id="ed-load" class="btn">Load</button>
                    <button id="ed-save" class="btn">Save</button>
                </div>
                <div class="toolbar-sep"></div>
                <div class="toolbar-group">
                    <button id="ed-play" class="btn">Play</button>
                    <button id="ed-stop" class="btn">Stop</button>
                    <button id="ed-loop" class="btn">Loop</button>
                </div>
                <div class="toolbar-sep"></div>
                <div class="toolbar-group">
                    <button id="ed-undo" class="btn">Undo</button>
                    <button id="ed-redo" class="btn">Redo</button>
                </div>
                <div class="toolbar-sep"></div>
                <div class="toolbar-group">
                    <button id="ed-cut" class="btn">Cut</button>
                    <button id="ed-copy" class="btn">Copy</button>
                    <button id="ed-paste" class="btn">Paste</button>
                    <button id="ed-delete" class="btn">Del</button>
                    <button id="ed-silence" class="btn">Silence</button>
                </div>
                <div class="toolbar-sep"></div>
                <div class="toolbar-group">
                    <button id="ed-trim" class="btn">Trim</button>
                    <button id="ed-select-all" class="btn">All</button>
                </div>
                <div class="toolbar-sep"></div>
                <div class="toolbar-group">
                    <button id="ed-zoom-in" class="btn">Z+</button>
                    <button id="ed-zoom-out" class="btn">Z-</button>
                    <button id="ed-zoom-fit" class="btn">Fit</button>
                    <button id="ed-zoom-sel" class="btn">ZSel</button>
                    <span id="clip-zoom" class="toolbar-val">100%</span>
                </div>
                <span id="clip-time" class="toolbar-val">0.00s</span>
            </div>

            <!-- Waveform canvas + sidebar row -->
            <div id="editor-body">
            <div id="editor-canvas-wrap">
                <canvas id="editor-canvas"></canvas>
            </div>

            <!-- Editor sidebar -->
            <div id="editor-sidebar">
                <!-- Process panel -->
                <div class="panel">
                    <div class="panel-title">Process</div>
                    <div class="ed-btn-row">
                        <button id="ed-normalize" class="btn ed-btn-wide">Normalize</button>
                        <button id="ed-reverse" class="btn ed-btn-wide">Reverse</button>
                    </div>
                    <div class="ed-btn-row">
                        <button id="ed-fade-in" class="btn ed-btn-wide">Fade In</button>
                        <button id="ed-fade-out" class="btn ed-btn-wide">Fade Out</button>
                    </div>
                    <div class="slider-row"><label>Gain</label><input type="range" id="ed-gain" min="-24" max="24" value="0"><span class="slider-val" id="ed-gain-val">0dB</span></div>
                    <button id="ed-gain-apply" class="btn ed-btn-wide">Apply Gain</button>
                </div>

                <!-- Pitch panel -->
                <div class="panel">
                    <div class="panel-title">Pitch</div>
                    <div class="slider-row"><label>Semi</label><input type="range" id="ed-pitch" min="-24" max="24" value="0"><span class="slider-val" id="ed-pitch-val">0</span></div>
                    <button id="ed-pitch-apply" class="btn ed-btn-wide">Apply Pitch</button>
                    <div class="ed-btn-row">
                        <button class="btn ed-pitch-btn" data-semi="-12">-Oct</button>
                        <button class="btn ed-pitch-btn" data-semi="-1">-1</button>
                        <button class="btn ed-pitch-btn" data-semi="1">+1</button>
                        <button class="btn ed-pitch-btn" data-semi="12">+Oct</button>
                    </div>
                </div>

                <!-- Time panel -->
                <div class="panel">
                    <div class="panel-title">Time</div>
                    <div class="slider-row"><label>Speed</label><input type="range" id="ed-speed" min="25" max="400" value="100"><span class="slider-val" id="ed-speed-val">100%</span></div>
                    <button id="ed-speed-apply" class="btn ed-btn-wide">Apply Speed</button>
                    <div class="ed-btn-row">
                        <button class="btn ed-speed-btn" data-speed="50">50%</button>
                        <button class="btn ed-speed-btn" data-speed="75">75%</button>
                        <button class="btn ed-speed-btn" data-speed="150">150%</button>
                        <button class="btn ed-speed-btn" data-speed="200">200%</button>
                    </div>
                </div>

                <!-- Insert panel -->
                <div class="panel">
                    <div class="panel-title">Insert</div>
                    <div class="slider-row"><label>Silence</label><input type="range" id="ed-silence-dur" min="10" max="5000" value="500"><span class="slider-val" id="ed-silence-dur-val">500ms</span></div>
                    <button id="ed-insert-silence" class="btn ed-btn-wide">Insert Silence</button>
                </div>

                <!-- Generate panel -->
                <div class="panel">
                    <div class="panel-title">Generate</div>
                    <div class="slider-row"><label>Freq</label><input type="range" id="ed-gen-freq" min="20" max="2000" value="440"><span class="slider-val" id="ed-gen-freq-val">440Hz</span></div>
                    <div class="slider-row"><label>Dur</label><input type="range" id="ed-gen-dur" min="50" max="5000" value="1000"><span class="slider-val" id="ed-gen-dur-val">1.0s</span></div>
                    <div id="ed-gen-wave-btns" class="btn-group full-width">
                        <button class="btn active" data-wave="sine">Sin</button>
                        <button class="btn" data-wave="square">Sqr</button>
                        <button class="btn" data-wave="sawtooth">Saw</button>
                        <button class="btn" data-wave="triangle">Tri</button>
                    </div>
                    <button id="ed-generate" class="btn ed-btn-wide">Generate Tone</button>
                    <button id="ed-gen-noise" class="btn ed-btn-wide">White Noise</button>
                </div>

                <!-- Synth Integration -->
                <div class="panel">
                    <div class="panel-title">Instrument</div>
                    <button id="ed-use-clip" class="btn ed-btn-wide btn-accent">Use as Instrument</button>
                    <button id="ed-clear-clip" class="btn ed-btn-wide">Reset to Oscillator</button>
                </div>
            </div>
            </div> <!-- /editor-body -->
        </div>

        <!-- Piano keyboard (shared between views) -->
        <div id="keyboard-wrap">
            <div id="keyboard"></div>
            <div id="octave-indicator">
                <span class="octave-hint">Shift+Tab</span>
                <span id="octave-display">C3</span>
                <span class="octave-hint">Tab</span>
            </div>
        </div>

        <!-- Status bar -->
        <div id="status-bar">
            <span id="note-display">--</span>
            <span id="freq-display">-- Hz</span>
            <span id="clip-status">No clip loaded</span>
            <span id="mic-note">Mic: --</span>
            <span id="mic-freq">-- Hz</span>
            <span id="fps-display">-- fps</span>
        </div>
    </div>

    <script src="lib/synth-engine.js"></script>
    <script src="lib/keyboard.js"></script>
    <script src="lib/visualizer.js"></script>
    <script src="lib/signal-chain.js"></script>
    <script src="lib/lfo.js"></script>
    <script src="lib/slider.js"></script>
    <script src="lib/layers.js"></script>
    <script src="lib/presets.js"></script>
    <script src="lib/sequencer.js"></script>
    <script src="lib/clip-editor.js"></script>
    <script src="app.js"></script>
</body>
</html>
