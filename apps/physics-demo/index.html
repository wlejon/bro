<!DOCTYPE html>
<html>
<head>
    <title>Physics Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud">
        <h2>Jolt Physics Demo</h2>
        <p>Click to drop spheres. Right-click to drop boxes.</p>
        <p id="stats">Bodies: 0</p>
        <div id="controls">
            <button id="btn-reset">Reset</button>
            <button id="btn-gravity">Zero Gravity</button>
            <button id="btn-explode">Explode!</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
