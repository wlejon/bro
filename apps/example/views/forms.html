<h1 class="view-title">Forms & Input</h1>

<!-- Text Inputs -->
<div class="form-section">
    <h2 class="section-title">Text Inputs</h2>
    <div class="form-row"><label>Text:</label><input id="f-name" type="text" placeholder="Enter your name"></div>
    <div class="form-row"><label>Password:</label><input id="f-pass" type="password" placeholder="Secret"></div>
    <div class="form-row"><label>Email:</label><input id="f-email" type="email" placeholder="user@example.com"></div>
    <div class="form-row"><label>Number:</label><input id="f-num" type="number" value="42" min="0" max="100" step="5"></div>
</div>

<!-- Textarea -->
<div class="form-section">
    <h2 class="section-title">Textarea</h2>
    <textarea id="f-bio" rows="3" placeholder="Tell us about yourself"></textarea>
</div>

<!-- Checkbox & Radio -->
<div class="form-section">
    <h2 class="section-title">Checkbox & Radio</h2>
    <div class="form-row">
        <label><input id="f-chk1" type="checkbox"> Option A</label>
        <label><input id="f-chk2" type="checkbox" checked> Option B</label>
    </div>
    <div class="form-row">
        <label><input type="radio" name="f-color" value="red" checked> Red</label>
        <label><input type="radio" name="f-color" value="green"> Green</label>
        <label><input type="radio" name="f-color" value="blue"> Blue</label>
    </div>
</div>

<!-- Range & Color -->
<div class="form-section">
    <h2 class="section-title">Range & Color</h2>
    <div class="form-row">
        <label>Range:</label>
        <input id="f-slider" type="range" min="0" max="100" value="50">
        <span id="f-slider-val">50</span>
    </div>
    <div class="form-row">
        <label>Color:</label>
        <input id="f-color" type="color" value="#3366cc">
        <span id="f-color-val">#3366cc</span>
    </div>
</div>

<!-- Select -->
<div class="form-section">
    <h2 class="section-title">Select</h2>
    <div class="form-row">
        <select id="f-sel">
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="cherry">Cherry</option>
        </select>
    </div>
</div>

<!-- Buttons -->
<div class="form-section">
    <h2 class="section-title">Buttons</h2>
    <div class="form-row">
        <input type="button" value="Button" id="f-btn1">
        <input type="submit" value="Submit" id="f-btn2">
        <input type="reset" value="Reset" id="f-btn3">
    </div>
</div>

<!-- Clipboard -->
<div class="form-section">
    <h2 class="section-title">Clipboard</h2>
    <div class="form-row"><label>Source:</label><input type="text" id="f-clip-src" value="Hello from Bro!"></div>
    <div class="form-row"><label>Target:</label><input type="text" id="f-clip-dst" placeholder="Paste here (Ctrl+V)"></div>
    <div class="hint">Ctrl+C to copy from source, Ctrl+V to paste into target</div>
</div>

<!-- Drag & Drop -->
<div class="form-section">
    <h2 class="section-title">Drag & Drop</h2>
    <div class="drop-zone" id="f-file-drop">Drop files here from your file explorer</div>
    <div style="height:8px;"></div>
    <div class="drop-zone" id="f-text-drop">Drag text from another application here</div>
</div>

<!-- Output -->
<div id="f-output" style="margin-top:12px;padding:10px;background:#1e293b;border:1px solid #334155;border-radius:4px;min-height:30px;">
    Interact with controls above...
</div>

<div class="log-box" id="f-log"></div>
