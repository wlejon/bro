<h1 class="view-title">Events</h1>

<style>
    @keyframes ev-flash { 0% { background-color: #22c55e; } 50% { background-color: #eab308; } 100% { background-color: #22c55e; } }
    .ev-box { width: 60px; height: 60px; background: #3b82f6; margin: 10px auto; border-radius: 4px; cursor: pointer; }
    .ev-box.active { background: #f472b6; }
    .ev-nested-outer { background: #1e3a5f; padding: 8px; border-radius: 4px; cursor: pointer; }
    .ev-nested-inner { width: 40px; height: 40px; background: #3b82f6; margin: 0 auto; border-radius: 4px; }
    .ev-nested-inner.active { background: #f472b6; }
    .ev-trans-box { width: 60px; height: 60px; background: #3b82f6; margin: 10px auto; border-radius: 4px; transition: background-color 0.5s ease; }
    .ev-trans-box:hover { background-color: #ef4444; }
    .ev-anim-box { width: 60px; height: 60px; border-radius: 4px; animation: ev-flash 1s ease-in-out 3; }
</style>

<!-- Click events -->
<h2 class="section-title">Click Events</h2>
<div class="grid">
    <div class="card" onclick="this.querySelector('.ev-box').classList.toggle('active')">
        <h3>Inline onclick (card)</h3>
        <div class="ev-box"></div>
    </div>
    <div class="card" id="ev-listener-card">
        <h3>addEventListener (card)</h3>
        <div class="ev-box" id="ev-listener-box"></div>
    </div>
    <div class="card">
        <h3>Listener on box</h3>
        <div class="ev-box" id="ev-direct-box"></div>
    </div>
    <div class="card" onclick="this.querySelector('.ev-nested-inner').classList.toggle('active')">
        <h3>Nested bubbling</h3>
        <div class="ev-nested-outer"><div class="ev-nested-inner"></div></div>
    </div>
    <div class="card" id="ev-text-card" style="line-height:80px;">
        <h3>Text toggle</h3>
        <span id="ev-text-label">OFF</span>
    </div>
    <div class="card" onclick="var t=event.target;document.getElementById('ev-target-log').textContent='target: '+(t.id||t.tagName)">
        <h3>event.target</h3>
        <div class="ev-box" id="ev-target-inner"></div>
        <div id="ev-target-log" style="font-size:10px;color:#94a3b8;margin-top:4px;"></div>
    </div>
</div>

<!-- Transition/Animation events -->
<h2 class="section-title">Transition & Animation Events</h2>
<div class="grid">
    <div class="card">
        <h3>Hover: transitionstart/end</h3>
        <div class="ev-trans-box" id="ev-trans-box">Hover</div>
    </div>
    <div class="card">
        <h3>Animation: 3x flash</h3>
        <div class="ev-anim-box" id="ev-anim-box">Flash</div>
    </div>
</div>

<div class="log-box" id="ev-log"></div>
