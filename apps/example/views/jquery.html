<h1 class="view-title">jQuery</h1>
<p style="color:#94a3b8;margin-bottom:12px;">jQuery compatibility — live dashboard with DOM manipulation, animation, and events.</p>

<style>
    .jq-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .jq-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; flex: 1; min-width: 200px; }
    .jq-panel h2 { font-size: 14px; color: #7dd3fc; margin-bottom: 10px; }
    .jq-stat { display: flex; align-items: center; margin-bottom: 6px; }
    .jq-stat .label { width: 40px; color: #94a3b8; font-size: 12px; }
    .jq-bar-track { flex: 1; height: 8px; background: #0f172a; border-radius: 4px; margin: 0 8px; }
    .jq-bar { height: 100%; border-radius: 4px; background: #3b82f6; transition: width 0.3s; }
    .jq-bar-mem { background: #8b5cf6; }
    .jq-bar-net { background: #22c55e; }
    .jq-stat .value { width: 40px; text-align: right; font-size: 12px; color: #e2e8f0; }
    #jq-feed { max-height: 150px; overflow-y: auto; }
    #jq-feed li { list-style: none; padding: 2px 0; font-size: 12px; color: #94a3b8; border-bottom: 1px solid #1e293b; }
    .jq-btn { background: #334155; border: 1px solid #475569; color: #e2e8f0; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin: 2px; }
    .jq-btn:hover { background: #475569; }
    .jq-status { display: inline-block; padding: 2px 8px; font-size: 11px; border-radius: 4px; background: #166534; color: #4ade80; margin-top: 8px; }
    .jq-card { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; margin: 4px; display: inline-block; font-size: 12px; }
    .jq-card .name { color: #7dd3fc; font-weight: bold; }
    .jq-card .val { color: #e2e8f0; }
    #jq-footer { margin-top: 16px; font-size: 11px; color: #64748b; display: flex; gap: 20px; }
</style>

<div class="jq-grid">
    <div class="jq-panel">
        <h2>System Stats</h2>
        <div class="jq-stat"><span class="label">CPU</span><div class="jq-bar-track"><div id="jq-cpu-bar" class="jq-bar" style="width:30%"></div></div><span id="jq-cpu-val" class="value">30%</span></div>
        <div class="jq-stat"><span class="label">MEM</span><div class="jq-bar-track"><div id="jq-mem-bar" class="jq-bar jq-bar-mem" style="width:50%"></div></div><span id="jq-mem-val" class="value">50%</span></div>
        <div class="jq-stat"><span class="label">NET</span><div class="jq-bar-track"><div id="jq-net-bar" class="jq-bar jq-bar-net" style="width:20%"></div></div><span id="jq-net-val" class="value">20%</span></div>
    </div>
    <div class="jq-panel">
        <h2>Live Feed</h2>
        <ul id="jq-feed"></ul>
    </div>
    <div class="jq-panel">
        <h2>Controls</h2>
        <button class="jq-btn" id="jq-pause">Pause</button>
        <button class="jq-btn" id="jq-clear">Clear Feed</button>
        <button class="jq-btn" id="jq-add-card">Add Card</button>
        <div class="jq-status" id="jq-status">Running</div>
    </div>
</div>

<div style="margin-top:12px;">
    <h2 class="section-title">Data Cards</h2>
    <div id="jq-cards"></div>
</div>

<div id="jq-footer">
    <span id="jq-version"></span>
    <span id="jq-update-count">0 updates</span>
</div>
