<h1 class="view-title">Networking</h1>
<p style="color:#94a3b8;margin-bottom:12px;">bro.net — game networking via GameNetworkingSockets (Valve GNS).</p>

<div style="margin-bottom:12px;">
    <button id="net-init">Init Network</button>
    <button id="net-host">Host (27015)</button>
    <button id="net-connect">Connect</button>
    <button id="net-send">Send Message</button>
    <button id="net-broadcast">Broadcast</button>
    <button id="net-close">Close</button>
</div>

<div class="form-row">
    <label>Address:</label>
    <input id="net-addr" type="text" value="127.0.0.1:27015">
</div>

<div style="margin:12px 0;">
    <span>Status: </span><span id="net-status" class="status-label">Not initialized</span>
    <span style="margin-left:20px;">Connections: </span><span id="net-conns">0</span>
</div>

<div class="log-box" id="net-log" style="height:300px;"></div>
