<!DOCTYPE html>
<html>
<head>
    <style>
        * { box-sizing: border-box; margin: 0; }

        body {
            font-family: sans-serif;
            font-size: 14px;
            background: #0f172a;
            color: #e2e8f0;
            padding: 24px;
        }

        h1 {
            font-size: 20px;
            color: #93c5fd;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 16px;
            color: #7dd3fc;
            margin: 14px 0 8px 0;
        }

        .section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            align-items: center;
        }

        label {
            width: 80px;
            color: #94a3b8;
            font-size: 13px;
        }

        input, textarea {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 4px;
            color: #e2e8f0;
            padding: 8px;
            font-family: sans-serif;
            font-size: 14px;
        }

        input { width: 300px; height: 36px; }

        textarea {
            width: 100%;
            height: 60px;
            resize: none;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .drop-zone {
            width: 100%;
            height: 80px;
            border: 2px dashed #475569;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 15px;
            transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .drop-zone.dragover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
            color: #38bdf8;
        }

        .drop-zone.dropped {
            border-color: #22c55e;
            color: #22c55e;
        }

        #log {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 8px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }

        #log div { padding: 1px 0; }
        .log-clip { color: #a78bfa; }
        .log-drag { color: #38bdf8; }
        .log-info { color: #64748b; }
    </style>
</head>
<body>
    <h1>Clipboard & Drag-Drop</h1>

    <!-- Clipboard section -->
    <div class="section">
        <h2>Clipboard</h2>
        <div class="row">
            <label>Source:</label>
            <input type="text" id="clip-src" value="Hello from Bro!">
        </div>
        <div class="row">
            <label>Target:</label>
            <input type="text" id="clip-dst" placeholder="Paste here (Ctrl+V)">
        </div>
        <div class="hint">Select the source field, Ctrl+C to copy, click the target, Ctrl+V to paste. Ctrl+X to cut.</div>
    </div>

    <!-- Textarea clipboard -->
    <div class="section">
        <h2>Textarea</h2>
        <textarea id="textarea" placeholder="Type here, then Ctrl+A / Ctrl+C / Ctrl+V / Ctrl+X...">The quick brown fox jumps over the lazy dog.</textarea>
        <div class="hint">Full clipboard support in multi-line text.</div>
    </div>

    <!-- Drag & Drop section -->
    <div class="section">
        <h2>File Drop</h2>
        <div class="drop-zone" id="file-drop">
            Drop files here from your file explorer
        </div>
    </div>

    <div class="section">
        <h2>Text Drop</h2>
        <div class="drop-zone" id="text-drop">
            Drag text from another application here
        </div>
    </div>

    <!-- Event log -->
    <h2>Event Log</h2>
    <div id="log"></div>

    <script>
        var logEl = document.getElementById('log');

        function log(msg, cls) {
            var d = document.createElement('div');
            d.textContent = msg;
            if (cls) d.className = cls;
            logEl.appendChild(d);
            logEl.scrollTop = logEl.scrollHeight;
        }

        log('Ready. Try clipboard shortcuts and drag-drop.', 'log-info');

        // --- Clipboard events ---

        var clipSrc = document.getElementById('clip-src');
        var clipDst = document.getElementById('clip-dst');
        var textarea = document.getElementById('textarea');

        function clipHandler(e) {
            var id = e.target.id || e.target.tagName;
            if (e.type === 'copy') {
                var text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
                log('copy on #' + id + ': "' + text + '"', 'log-clip');
            } else if (e.type === 'cut') {
                var text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
                log('cut on #' + id + ': "' + text + '"', 'log-clip');
            } else if (e.type === 'paste') {
                var text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
                log('paste on #' + id + ': "' + text + '"', 'log-clip');
            }
        }

        clipSrc.addEventListener('copy', clipHandler);
        clipSrc.addEventListener('cut', clipHandler);
        clipDst.addEventListener('paste', clipHandler);
        textarea.addEventListener('copy', clipHandler);
        textarea.addEventListener('cut', clipHandler);
        textarea.addEventListener('paste', clipHandler);

        // Also listen on body for any clipboard events
        document.body.addEventListener('copy', function(e) {
            if (e.target === clipSrc || e.target === textarea) return;
            log('copy (body): ' + (e.clipboardData ? e.clipboardData.getData('text/plain') : ''), 'log-clip');
        });
        document.body.addEventListener('paste', function(e) {
            if (e.target === clipDst || e.target === textarea) return;
            log('paste (body): ' + (e.clipboardData ? e.clipboardData.getData('text/plain') : ''), 'log-clip');
        });

        // --- Drag & Drop: file drop ---

        var fileDrop = document.getElementById('file-drop');

        fileDrop.addEventListener('dragenter', function(e) {
            e.preventDefault();
            fileDrop.className = 'drop-zone dragover';
            log('dragenter on #file-drop', 'log-drag');
        });

        fileDrop.addEventListener('dragover', function(e) {
            e.preventDefault();
        });

        fileDrop.addEventListener('dragleave', function(e) {
            fileDrop.className = 'drop-zone';
        });

        fileDrop.addEventListener('drop', function(e) {
            e.preventDefault();
            fileDrop.className = 'drop-zone dropped';

            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                var count = e.dataTransfer.files.length;
                var names = [];
                for (var i = 0; i < count; i++) {
                    names.push(e.dataTransfer.files[i].name);
                }
                fileDrop.textContent = count + ' file(s): ' + names.join(', ');
                log('drop ' + count + ' file(s): ' + names.join(', '), 'log-drag');
            } else {
                fileDrop.textContent = 'Drop received (no files)';
                log('drop on #file-drop (no files)', 'log-drag');
            }

            // Reset after 3 seconds
            setTimeout(function() {
                fileDrop.className = 'drop-zone';
                fileDrop.textContent = 'Drop files here from your file explorer';
            }, 3000);
        });

        // --- Drag & Drop: text drop ---

        var textDrop = document.getElementById('text-drop');

        textDrop.addEventListener('dragenter', function(e) {
            e.preventDefault();
            textDrop.className = 'drop-zone dragover';
            log('dragenter on #text-drop', 'log-drag');
        });

        textDrop.addEventListener('dragover', function(e) {
            e.preventDefault();
        });

        textDrop.addEventListener('dragleave', function(e) {
            textDrop.className = 'drop-zone';
        });

        textDrop.addEventListener('drop', function(e) {
            e.preventDefault();
            textDrop.className = 'drop-zone dropped';

            var text = '';
            if (e.dataTransfer) {
                text = e.dataTransfer.getData('text/plain');
            }
            if (text) {
                textDrop.textContent = 'Dropped: "' + text + '"';
                log('drop text: "' + text + '"', 'log-drag');
            } else {
                textDrop.textContent = 'Drop received (no text)';
                log('drop on #text-drop (no text data)', 'log-drag');
            }

            setTimeout(function() {
                textDrop.className = 'drop-zone';
                textDrop.textContent = 'Drag text from another application here';
            }, 3000);
        });
    </script>
</body>
</html>
