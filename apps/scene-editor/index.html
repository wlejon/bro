<!DOCTYPE html>
<html>
<head>
    <title>Scene Editor (spike)</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        body {
            background: #1a1a1a;
            color: #eee;
            font-family: system-ui, sans-serif;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: transparent; }
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.75);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            z-index: 10;
            pointer-events: none;
            font-family: monospace;
            white-space: nowrap;
            width: 320px;
        }
        #hud h2 { font-size: 13px; margin: 0 0 4px 0; color: #7bed9f; font-family: system-ui, sans-serif; }
        #hud .hint { color: #bbb; font-size: 11px; font-family: system-ui, sans-serif; white-space: nowrap; }
        #hud .hint b { color: #ffa502; }
        #pick-info {
            color: #74b9ff;
            margin-top: 6px;
            min-height: 1em;
        }
        #snap-info {
            margin-top: 4px;
            min-height: 1em;
            font-family: system-ui, sans-serif;
            font-size: 11px;
            color: #aaa;
        }
        #snap-info b { color: #fff; }
        #snap-marker {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: none;
            width: 18px;
            height: 18px;
        }
        #snap-marker svg { display: block; }
        /* VCB (Value Control Box): precision distance input. Bottom-right
           corner, SketchUp-style. Shows the typed buffer with a blinking
           caret and a trailing hint so the user learns the workflow. */
        #measure-box {
            position: absolute;
            right: 14px;
            bottom: 14px;
            background: rgba(0,0,0,0.80);
            color: #eee;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.4;
            z-index: 15;
            pointer-events: none;
            min-width: 180px;
            display: none;
        }
        #measure-box .label { color: #aaa; font-size: 11px; font-family: system-ui, sans-serif; }
        #measure-box .value { color: #ffa502; font-size: 16px; font-weight: bold; }
        #measure-box .caret {
            display: inline-block;
            width: 1px;
            background: #ffa502;
            height: 14px;
            margin-left: 2px;
            vertical-align: -3px;
            animation: vcb-blink 1.0s steps(2, start) infinite;
        }
        #measure-box .hint { color: #888; font-size: 10px; font-family: system-ui, sans-serif; margin-top: 2px; }
        @keyframes vcb-blink { to { visibility: hidden; } }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hud">
        <h2>Scene Editor</h2>
        <div class="hint"><b>right-drag</b> rotate &nbsp;·&nbsp; <b>middle-drag</b> pan &nbsp;·&nbsp; <b>wheel</b> zoom</div>
        <div class="hint"><b>S</b> select &nbsp;·&nbsp; <b>P</b> push/pull &nbsp;·&nbsp; <b>Esc</b> cancel</div>
        <div class="hint">during drag: type <b>distance</b> + <b>Enter</b> for exact</div>
        <div class="hint">tool: <span id="tool-name">select</span></div>
        <div id="pick-info">no pick</div>
        <div id="snap-info"></div>
    </div>
    <div id="snap-marker"></div>
    <div id="measure-box"></div>
    <script src="../lib/camera.js"></script>
    <script src="edit-mesh.js"></script>
    <script src="inference.js"></script>
    <script src="scene-axes.js"></script>
    <script src="edge-mesh.js"></script>
    <script src="measure-box.js"></script>
    <script src="primitive.js"></script>
    <script src="primitive-registry.js"></script>
    <script src="app.js"></script>
</body>
</html>
