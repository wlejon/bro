<!DOCTYPE html>
<html>
<head>
    <title>Form Controls Test</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        h2 { margin-top: 20px; margin-bottom: 5px; }
        label { display: inline-block; margin-right: 10px; margin-top: 8px; }
        .row { margin-top: 8px; }
        textarea { width: 300px; }
        #output { margin-top: 20px; padding: 10px; background-color: #f0f0f0; border: 1px solid #ccc; min-height: 40px; }
    </style>
</head>
<body>
    <h1>Form Controls Test</h1>

    <h2>Text Inputs</h2>
    <div class="row">
        <label>Text:</label>
        <input id="name" type="text" placeholder="Enter your name">
    </div>
    <div class="row">
        <label>Password:</label>
        <input id="pass" type="password" placeholder="Secret">
    </div>
    <div class="row">
        <label>Email:</label>
        <input id="email" type="email" placeholder="user@example.com">
    </div>
    <div class="row">
        <label>Number:</label>
        <input id="num" type="number" value="42" min="0" max="100" step="5">
    </div>

    <h2>Textarea</h2>
    <div class="row">
        <textarea id="bio" rows="3" cols="40" placeholder="Tell us about yourself"></textarea>
    </div>

    <h2>Checkbox &amp; Radio</h2>
    <div class="row">
        <label><input id="chk1" type="checkbox"> Option A</label>
        <label><input id="chk2" type="checkbox" checked> Option B</label>
    </div>
    <div class="row">
        <label><input type="radio" name="color" value="red" checked> Red</label>
        <label><input type="radio" name="color" value="green"> Green</label>
        <label><input type="radio" name="color" value="blue"> Blue</label>
    </div>

    <h2>Range</h2>
    <div class="row">
        <input id="slider" type="range" min="0" max="100" value="50" step="1">
        <span id="slider-val">50</span>
    </div>

    <h2>Color</h2>
    <div class="row">
        <input id="clr" type="color" value="#3366cc">
        <span id="clr-val">#3366cc</span>
    </div>

    <h2>Select</h2>
    <div class="row">
        <select id="sel">
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="cherry">Cherry</option>
            <option value="date">Date</option>
        </select>
    </div>

    <h2>Buttons</h2>
    <div class="row">
        <input type="button" value="Button" id="btn1">
        <input type="submit" value="Submit" id="btn2">
        <input type="reset" value="Reset" id="btn3">
    </div>

    <div id="output">Interact with controls above...</div>

    <input type="hidden" id="secret" value="hidden-data">

    <script src="app.js"></script>
</body>
</html>
