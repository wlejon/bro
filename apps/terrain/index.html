<!DOCTYPE html>
<html>
<head>
    <title>Endless Terrain</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; cursor: crosshair; width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 10px; left: 10px;
            color: #ddd; font: 13px monospace;
            background: rgba(0, 0, 0, 0.65); padding: 10px 14px;
            border-radius: 6px; pointer-events: none;
            line-height: 1.5;
        }
        #hud b { color: #ffa502; }
        #hud .title { color: #7bed9f; font-size: 15px; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; margin: -3px 0 0 -3px;
            background: #fff; border-radius: 50%;
            pointer-events: none; opacity: 0.7;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="crosshair"></div>
    <div id="hud">
        <div class="title">Endless Terrain</div>
        <b>WASD</b> Move &nbsp; <b>Space/Ctrl</b> Up/Down<br>
        <b>Shift</b> Sprint &nbsp; <b>Mouse</b> Look (click to capture)<br>
        <b>Left Click</b> Dig &nbsp; <b>Right Click</b> Place<br>
        <div id="info"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
