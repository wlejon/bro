<!DOCTYPE html>
<html>
<head>
    <title>World</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #6b8ea0; }
        canvas { display: block; cursor: crosshair; width: 100vw; height: 100vh; }

        #hud {
            position: absolute; top: 10px; left: 10px;
            color: #fff; font: 13px monospace;
            background: rgba(0,0,0,0.55); padding: 10px 14px;
            border-radius: 6px; pointer-events: none;
            line-height: 1.5;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 12px; height: 12px; margin: -6px 0 0 -6px;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 50%; pointer-events: none;
        }

        #status {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, 30px);
            color: #ffe066; font: 13px monospace;
            background: rgba(0,0,0,0.6); padding: 4px 12px;
            border-radius: 4px; pointer-events: none;
            opacity: 0; transition: opacity 0.2s;
        }
        #status.show { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="crosshair"></div>

    <div id="hud">
        <div id="info">Loading...</div>
    </div>

    <div id="status"></div>

    <script src="app.js"></script>
</body>
</html>
