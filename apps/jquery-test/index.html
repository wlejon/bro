<!DOCTYPE html>
<html>
<head>
    <title>jQuery API Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container main">
        <h1 id="title">jQuery API Test</h1>
        <div id="section1" class="section active">
            <p id="para1" class="text highlight">First paragraph</p>
            <p id="para2" class="text">Second paragraph</p>
            <p id="para3" class="text dim">Third paragraph</p>
        </div>
        <div id="section2" class="section">
            <ul id="list">
                <li id="item1" class="item odd">Item 1</li>
                <li id="item2" class="item even">Item 2</li>
                <li id="item3" class="item odd">Item 3</li>
            </ul>
        </div>
        <div id="section3" class="section">
            <button id="btn1" class="btn primary">Button 1</button>
            <button id="btn2" class="btn secondary">Button 2</button>
        </div>
        <div id="output"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
