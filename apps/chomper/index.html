<!DOCTYPE html>
<html>
<head>
    <title>Chomper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game"></canvas>

    <div id="hud" style="display:none">
        <div class="hud-row">
            <div class="hud-cell">
                <div class="hud-label">SCORE</div>
                <div id="hud-score" class="hud-value">0</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">HIGH</div>
                <div id="hud-high" class="hud-value">0</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">LIVES</div>
                <div id="hud-lives" class="hud-value">3</div>
            </div>
            <div class="hud-cell">
                <div class="hud-label">LEVEL</div>
                <div id="hud-level" class="hud-value">1</div>
            </div>
        </div>
    </div>

    <div id="center-text"></div>

    <div id="overlay">
        <div id="screen-title" class="screen">
            <div class="overlay-title">CHOMPER</div>
            <div class="overlay-sub">
                <p>Arrow keys to move</p>
                <p>Eat all the pellets to win</p>
                <p>Power pellets make ghosts edible</p>
                <p>Avoid ghosts or lose a life</p>
            </div>
            <div class="menu-items">
                <div class="menu-item selected" data-action="play">PLAY</div>
                <div class="menu-item" data-action="quit">QUIT</div>
            </div>
            <div class="overlay-hint">Press ENTER to start</div>
            <div class="hs-line">High Score: <span id="title-high">0</span></div>
        </div>

        <div id="screen-gameover" class="screen">
            <div class="overlay-title" id="gameover-title">GAME OVER</div>
            <div class="overlay-sub">
                <p>Score: <span id="go-score">0</span></p>
                <p>High Score: <span id="go-high">0</span></p>
                <p id="go-new" style="display:none; color:#ffff00">NEW HIGH SCORE!</p>
            </div>
            <div class="menu-items">
                <div class="menu-item selected" data-action="play">PLAY AGAIN</div>
                <div class="menu-item" data-action="title">MAIN MENU</div>
            </div>
        </div>

        <div id="screen-paused" class="screen">
            <div class="overlay-title">PAUSED</div>
            <div class="menu-items">
                <div class="menu-item selected" data-action="resume">RESUME</div>
                <div class="menu-item" data-action="title">QUIT TO MENU</div>
            </div>
        </div>
    </div>

    <script src="../lib/loop.js"></script>
    <script src="../lib/canvas.js"></script>
    <script src="../lib/input.js"></script>
    <script src="../lib/audio.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="../lib/screens.js"></script>
    <script src="storage.js"></script>
    <script src="audio.js"></script>
    <script src="maze.js"></script>
    <script src="ghosts.js"></script>
    <script src="input.js"></script>
    <script src="screens.js"></script>
    <script src="app.js"></script>
</body>
</html>
