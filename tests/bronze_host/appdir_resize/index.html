<!doctype html>
<html>
<head><meta charset="utf-8"><title>bronze resize probe</title></head>
<!-- Explicit pixel sizes and no padding or border anywhere, so every number the
     probe pins is one this file states rather than one layout derived. A box
     sized by its content would make the expectation a record of this build's
     font metrics. -->
<body style="margin:0">
<div id="a" style="width:100px;height:50px"></div>
<div id="b" style="width:60px;height:20px"></div>
<div id="c" style="width:40px;height:30px"></div>
</body>
</html>
