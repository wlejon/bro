<!DOCTYPE html>
<html>
<head><style>
  html, body { margin: 0; width: 100%; height: 100%; background: #203040; overflow: hidden; }
  #box { position: absolute; left: 0; top: 40px; width: 40px; height: 40px; background: #00ff00; }
</style></head>
<body>
  <div id="box"></div>
  <script>
    // Something on screen changes every frame, so a recording has frames.
    const box = document.getElementById('box');
    let x = 0;
    function step() {
      x = (x + 3) % 280;
      box.style.left = x + 'px';
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  </script>
</body>
</html>
