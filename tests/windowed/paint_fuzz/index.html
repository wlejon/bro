<!DOCTYPE html>
<html>
<head><style>
  @font-face { font-family: FuzzFace; src: url("../../style/font_face_app/ui/fonts/Inter-Regular.ttf"); }
  html, body { margin: 0; background: #203040; font: 13px sans-serif; color: #eee; }
  #stage { position: relative; padding: 4px; }
  .b { margin: 2px; padding: 2px; min-height: 6px; min-width: 6px; border: 1px solid #000; }
  .c0 { background: #c33; }
  .c1 { background: #3a3; color: #111; }
  .c2 { background: #36c; border-radius: 6px; }
  .c3 { background: #cc3; color: #222; border-width: 3px; border-style: dashed; }
  .c4 { background: linear-gradient(90deg, #f80, #80f); box-shadow: 2px 2px 4px #000; }
  .hov:hover { background: #fff; color: #000; }
  .tr { transition: background-color 400ms linear, width 400ms linear, opacity 400ms linear; }
  .tr.lit { background-color: #0ff; width: 120px; opacity: 0.6; }
  .anim { animation: slide 900ms linear infinite alternate; }
  .pulse { animation: pulse 700ms linear infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 40px; } }
  @keyframes pulse { from { opacity: 1; transform: scale(1); } to { opacity: 0.3; transform: scale(0.8); } }
  .scroller { height: 60px; overflow: auto; }
  .list { margin: 2px 0 2px 24px; padding: 0; }
</style></head>
<body>
  <div id="stage"></div>
  <!-- Poked (inline style, no selector input) to make a frame record again. -->
  <div id="sentinel" style="position:absolute; left:-50px; top:0; width:10px; height:10px"></div>
  <script src="steps.js"></script>
  <script src="main.js"></script>
</body>
</html>
