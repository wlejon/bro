<!DOCTYPE html>
<html>
<head><style>
  html, body { margin: 0; width: 100%; height: 100%; background: #203040; overflow: hidden; }
  #b { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; padding: 8px; border: 0;
       display: flex; align-items: center; justify-content: center; background: #445; color: #aaa;
       border-radius: 6px; transition: background 120ms ease, color 120ms ease; }

  #b:hover { background: #667; color: #fff; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .tooltip { position: fixed; left: 40px; top: 100px; width: 80px; height: 20px; background: #ff0000;
             pointer-events: none; animation: fade-in 120ms ease; }
</style></head>
<body>
  <button id="b" data-tip="Open"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <script src="main.js"></script>

</html>
