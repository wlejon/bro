<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="120">
      <rect x="0" y="0" width="80" height="60" fill="url(#fade)"/>
    </mask>
    <mask id="m2">
      <circle cx="120" cy="30" r="22" fill="white"/>
      <circle cx="120" cy="30" r="10" fill="black"/>
    </mask>
    <mask id="m3" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="0.5" fill="#808080"/>
      <rect x="0" y="0.5" width="1" height="0.5" fill="white"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="80" height="60" fill="#e02020" mask="url(#m1)"/>
  <rect x="90" y="0" width="70" height="60" fill="#2040e0" mask="url(#m2)"/>
  <g mask="url(#m3)">
    <rect x="10" y="70" width="140" height="44" fill="#20a040"/>
  </g>
</svg>
