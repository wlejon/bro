<!DOCTYPE html>
<html>
<head>
    <title>Test App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <script>
        // Document-lifecycle capture for tests/layout/test_load_geometry.js.
        // Records readyState + #root geometry at each stage so a test can
        // assert layout is complete before DOMContentLoaded/load fire.
        window.__lifecycle = {
            scriptEval: { readyState: document.readyState }
        };
        document.addEventListener('DOMContentLoaded', function () {
            window.__lifecycle.domContentLoaded = {
                readyState: document.readyState,
                rootWidth: document.getElementById('root').clientWidth
            };
        });
        window.addEventListener('load', function () {
            window.__lifecycle.load = {
                readyState: document.readyState,
                rootWidth: document.getElementById('root').clientWidth
            };
        });
    </script>
    <script type="module">
        // The page's half of tests/headless/test_module_instance_sharing.js:
        // one module, evaluated here, which a driver script later imports by
        // the same specifier. The `type="module"` is load-bearing — it is what
        // puts the file in the page's module graph rather than inlining it.
        import { bump } from "/app/module_instance.js";
        bump();
    </script>
    <!-- tests/engine/test_page_module_script_url.js: an external module in a
         subdirectory is its own module with its own URL. -->
    <script type="module" src="module_sub/main.js"></script>
    <script>
        // Hide the menu bar so innerHeight matches the configured viewport.
        // (Mouse coords from getBoundingClientRect work either way thanks
        // to the headless globals folding contentTop in automatically.)
        if (typeof bro !== 'undefined' && bro.menu) bro.menu.hide();
    </script>
</body>
</html>
