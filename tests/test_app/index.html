<!DOCTYPE html>
<html>
<head>
    <title>Test App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <script>
        // Engine reserves a top inset for the menu bar (~28px); tests click
        // in absolute viewport coords starting at (0,0), so hide the menu
        // to give them the full viewport.
        if (typeof bro !== 'undefined' && bro.menu) bro.menu.hide();
    </script>
</body>
</html>
