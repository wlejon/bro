<!DOCTYPE html>
<html>
<head>
  <title>AppView Busy</title>
  <style>html, body { margin: 0; width: 100%; height: 100%; }</style>
</head>
<body>
  <script>
    // An app that works too long: a long job on a message, which must yield
    // to its host page slice by slice, and a click listener that never
    // returns, which its page waits on, so the runtime stops the app.
    window.addEventListener('message', (e) => {
      // An exception nothing catches: the app runs on.
      if (e.data === 'throw') throw new Error('busy threw on purpose');
      // A job that never finishes: it yields, and the page hears the app
      // stopped responding.
      if (e.data === 'forever') for (;;) {}
      if (e.data !== 'spin') return;
      let x = 0;
      for (let i = 0; i < 2e8; i++) x = (x + i) | 0;
      parent.postMessage({ spun: true, x });
    });
    document.body.addEventListener('click', () => {
      for (;;) {}
    });
    parent.postMessage({ ready: true });
  </script>
</body>
</html>
