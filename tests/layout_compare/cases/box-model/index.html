<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; font-size: 16px; }
body { background: white; }

#outer {
  width: 400px;
  height: 300px;
  padding: 20px;
  border: 5px solid black;
  margin: 10px;
  background: #eee;
}

#inner {
  width: 200px;
  height: 100px;
  padding: 10px;
  border: 2px solid red;
  margin: 15px;
  background: #ccc;
}

#content-box {
  box-sizing: content-box;
  width: 150px;
  height: 80px;
  padding: 10px;
  border: 3px solid blue;
  margin: 5px;
  background: #ddd;
}
</style>
</head>
<body>
  <div id="outer">
    <div id="inner">
      <div id="content-box">content-box</div>
    </div>
  </div>
</body>
</html>
