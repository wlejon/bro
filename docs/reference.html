<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bro reference</title>
<meta name="description" content="API references and guides for bro.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<style>
:root {
  color-scheme: dark;
  --bg:      #080a0f;
  --bg2:     #0b0e14;
  --panel:   #0f141c;
  --border:  #1b2330;
  --border2: #28323f;
  --text:    #c3ccd8;
  --dim:     #828d9c;
  --faint:   #5c6573;
  --head:    #eef2f7;
  --cyan:    #34e3c9;
  --violet:  #a78bfa;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6;
  display: grid; grid-template-columns: 296px 1fr; -webkit-font-smoothing: antialiased;
}
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--mono); }

nav {
  background: var(--bg2); border-right: 1px solid var(--border);
  height: 100vh; overflow-y: auto; padding: 0 0 32px; position: sticky; top: 0;
}
nav .home {
  padding: 18px 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
  position: sticky; top: 0; background: var(--bg2); z-index: 2;
}
nav .home a { color: var(--head); font-family: var(--mono); font-weight: 700; font-size: 16px; }
nav .home a:hover { text-decoration: none; color: var(--cyan); }
nav .home .crumb { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
nav h3 { margin: 18px 20px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cyan); font-weight: 600; }
nav ul { list-style: none; margin: 0; padding: 0; }
nav li a { display: block; padding: 7px 20px 7px 20px; color: var(--text); font-size: 13px; border-left: 2px solid transparent; }
nav li a:hover { background: var(--panel); text-decoration: none; }
nav li a.active { background: rgba(52,227,201,0.08); border-left-color: var(--cyan); color: var(--cyan); font-weight: 500; }
nav li a.active .desc { color: var(--dim); }
nav li .name { font-family: var(--mono); }
nav li .desc { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; line-height: 1.4; }

main { padding: 30px 44px 90px; max-width: 1000px; min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.bar h1 { margin: 0; font-size: 22px; font-family: var(--mono); color: var(--head); }
.bar .meta { font-size: 12px; color: var(--faint); }
.bar .meta a { margin-left: 12px; color: var(--dim); }
#content { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0; overflow: hidden; }
#content.md { padding: 28px 34px; }
#content pre { margin: 0; }
#content pre code.hljs { padding: 24px 28px; font-size: 13px; line-height: 1.6; background: var(--bg2); }
/* markdown */
.md h1 { font-size: 27px; margin: 0 0 14px; color: var(--head); }
.md h2 { font-size: 20px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); color: var(--head); }
.md h3 { font-size: 16px; margin: 22px 0 8px; color: var(--head); }
.md h4 { font-size: 14px; margin: 18px 0 6px; color: var(--text); }
.md p { margin: 0 0 12px; color: var(--text); }
.md ul, .md ol { margin: 0 0 12px; padding-left: 24px; }
.md li { margin-bottom: 4px; }
.md code { background: var(--bg2); padding: 1px 6px; border-radius: 4px; font-size: 13px; color: var(--cyan); border: 1px solid var(--border); }
.md pre { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 14px; }
.md pre code { background: transparent; padding: 0; font-size: 13px; border: none; color: var(--text); }
.md blockquote { margin: 0 0 12px; padding: 8px 14px; border-left: 3px solid var(--border2); color: var(--dim); background: var(--bg2); border-radius: 0 6px 6px 0; }
.md table { border-collapse: collapse; margin: 0 0 14px; width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; font-size: 13px; }
.md th { background: var(--bg2); color: var(--head); }
.md a { color: var(--cyan); }
.loading { padding: 44px; text-align: center; color: var(--faint); font-size: 14px; }
.error { padding: 28px 32px; color: #e0975a; }
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; }
  nav { position: static; height: auto; max-height: 56vh; }
  nav .home { position: static; }
  main { padding: 22px; }
}
</style>
</head>
<body>

<nav>
  <div class="home">
    <a href="./">← bro<span style="color:var(--cyan)">.</span></a>
    <div class="crumb">Reference</div>
  </div>
  <div id="sidebar"></div>
</nav>

<main>
  <div class="bar">
    <h1 id="doc-title">Reference</h1>
    <div class="meta" id="doc-meta"></div>
  </div>
  <div id="content" class="loading">Pick a document from the sidebar.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>
// Grouped catalog. Each group: [heading, [[file, description], ...]]
const GROUPS = [
  ["Web platform", [
    ["brokit-api.js", "fs, fetch, crypto, WebSocket, streams, storage"],
    ["worker-api.js", "Worker: web worker threads"],
    ["image-api.js", "bro.image: CPU kernels + bro.image.gpu WebGL2 renderer"],
    ["imagebitmap-api.js", "ImageBitmap / createImageBitmap"],
    ["file-api.js", "Blob / File, FileReader, URL.createObjectURL"],
    ["video-api.js", "&lt;video&gt; playback, VideoEncoder (WebM/VP9), GifEncoder"],
    ["iframe-api.js", "&lt;iframe src=dir&gt;: isolated sub-document"],
    ["window-api.js", "bro.window: multi-window, borderless, displays"],
    ["matchmedia-api.js", "window.matchMedia: MediaQueryList + change events"],
    ["web-animations-api.js", "element.animate(): WAAPI subset"],
    ["pointer-api.js", "Pointer + Touch Events: capture, compat synthesis"],
    ["gamepad-api.js", "Gamepad API: snapshots, rumble, action bindings"],
    ["time-api.js", "bro.time: global pause + timescale"],
  ]],
  ["Graphics & 3D", [
    ["scene-api.js", "3D scene graph: shapes, sprites, meshes, physics nodes"],
    ["lighting-api.js", "PBR lighting: dir/point/spot lights, materials, tonemap"],
    ["mesh-api.js", "bro.mesh: primitives, CSG, simplification, UV, I/O"],
    ["animation-api.js", "Keyframe clips, blend spaces, state machine, root motion"],
    ["terrain-api.js", "Chunked height-field terrain: noise, streaming, edits, raycast"],
    ["clipmap-api.js", "scene.createClipmapTerrain: camera-centred clipmap rings"],
    ["tile-api.js", "scene.createTileWorld: square + hex tile grids"],
    ["noise-api.js", "bro.noise: FastNoise2 SIMD noise generation"],
    ["flora-api.js", "bro.flora: ecosystem sim, plants, foliage, blooms"],
    ["gizmo-api.js", "3D transform handles for scene editing"],
  ]],
  ["Physics & audio", [
    ["physics-api.js", "Jolt rigid bodies, shapes, raycasts, contact events"],
    ["audio-api.js", "AudioContext, Web Audio nodes, synth, sequencing, spatial"],
    ["mic-api.js", "bro.mic: live mic chunk consumer"],
  ]],
  ["On-device AI/ML", [
    ["gpu-api.js", "bro.gpu: runtime backend probe (cuda / metal / cpu)"],
    ["tensor-api.js", "bro.tensor: GPU tensor + ops (CUDA / Metal)"],
    ["lm-api.js", "bro.lm: Qwen3 / Mistral text generation"],
    ["diffusion-api.js", "bro.diffusion: text-to-image (U-Net/VAE/LoRA)"],
    ["tts-api.js", "bro.tts: text-to-speech (Kokoro, Qwen3-TTS)"],
    ["stt-api.js", "bro.stt: Whisper, Parakeet-TDT, Qwen3-ASR"],
    ["diar-api.js", "bro.diar: speaker diarization (streaming + clustering)"],
    ["motion-api.js", "bro.motion: text-to-motion (G1 skeleton)"],
    ["wake-api.js", "bro.wake: streaming wake-word detection"],
    ["kws-api.js", "bro.kws: open-vocabulary keyword spotting"],
    ["sense-api.js", "bro.sense: model-free acoustic sensors (VAD/onset)"],
    ["gesture-api.js", "bro.gesture: non-speech gesture matching"],
    ["listen-api.js", "bro.listen: N concurrent unmixed audio streams"],
    ["vision-api.js", "bro.vision: SAM, depth, normals, matting, ControlNet"],
    ["triposplat-api.js", "bro.triposplat: single image to a 3D Gaussian splat"],
    ["rave-api.js", "bro.rave: RAVE neural audio autoencoder"],
  ]],
  ["Game & networking", [
    ["ai-game-api.js", "bro.ai.game: navmesh, pathfinding, steering, perception"],
    ["net-api.js", "bro.net: game networking via GNS"],
    ["net-sync-api.js", "bro.net.sync: replication + RPCs (host-star)"],
  ]],
  ["Native shell", [
    ["dialogs-api.js", "Native open/save file and folder dialogs"],
    ["menu-api.js", "bro.menu: native menu bar"],
    ["math-api.js", "bro.math: bromath types (SpatialHash3D)"],
    ["paths-api.js", "bro.appDir / bro.resolvePath: real filesystem paths"],
  ]],
];
const GUIDES = [
  ["headless.md", "Headless mode: globals, input sim, virtual time"],
  ["settings.md", "Settings system: defaults, overrides, action binding"],
  ["inspect.md", "DOM inspector, useful in headless"],
  ["system-panels.md", "System panels: __bro bridge, panel authoring, PanelLayout"],
  ["projects.md", "Built-in project manager and skeletons"],
  ["build-options.md", "Modular build: profiles, BRO_WITH_* flags, stubs"],
  ["multi-repo-workflow.md", "Working across bro and its sibling repos"],
  ["embedding.md", "Linking bro_engine into your own executable"],
  ["coverage.md", "OpenCppCoverage line-coverage reports"],
];

const ALL = [...GROUPS.flatMap(([, items]) => items), ...GUIDES];

function buildSidebar() {
  const root = document.getElementById("sidebar");
  let html = "";
  for (const [heading, items] of GROUPS) {
    html += `<h3>${heading}</h3><ul>` + items.map(([file, desc]) =>
      `<li><a href="#${file}" data-file="${file}"><span class="name">${file}</span><span class="desc">${desc}</span></a></li>`
    ).join("") + `</ul>`;
  }
  html += `<h3>Guides</h3><ul>` + GUIDES.map(([file, desc]) =>
    `<li><a href="#${file}" data-file="${file}"><span class="name">${file}</span><span class="desc">${desc}</span></a></li>`
  ).join("") + `</ul>`;
  root.innerHTML = html;
}

function setActive(file) {
  document.querySelectorAll("nav a[data-file]").forEach(a => {
    a.classList.toggle("active", a.dataset.file === file);
  });
}

async function loadDoc(file) {
  const isMd = file.endsWith(".md");
  const isJs = file.endsWith(".js");
  document.getElementById("doc-title").textContent = file;
  document.getElementById("doc-meta").innerHTML =
    `<a href="${file}" target="_blank" rel="noopener">view raw →</a>`;
  const content = document.getElementById("content");
  content.className = "loading";
  content.textContent = "Loading…";
  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const text = await res.text();
    if (isMd) {
      content.className = "md";
      content.innerHTML = marked.parse(text);
      content.querySelectorAll("pre code").forEach(el => {
        try { hljs.highlightElement(el); } catch {}
      });
    } else if (isJs) {
      content.className = "";
      const code = document.createElement("code");
      code.className = "language-javascript hljs";
      code.textContent = text;
      const pre = document.createElement("pre");
      pre.appendChild(code);
      content.innerHTML = "";
      content.appendChild(pre);
      try { hljs.highlightElement(code); } catch {}
    } else {
      content.className = "md";
      content.textContent = text;
    }
  } catch (e) {
    content.className = "error";
    content.textContent = `Failed to load ${file}: ${e.message}`;
  }
  setActive(file);
  window.scrollTo(0, 0);
}

function fileFromHash() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return null;
  return ALL.some(([f]) => f === h) ? h : null;
}

function init() {
  buildSidebar();
  const initial = fileFromHash() || ALL[0][0];
  loadDoc(initial);
  window.addEventListener("hashchange", () => {
    const f = fileFromHash();
    if (f) loadDoc(f);
  });
  document.querySelector("nav").addEventListener("click", e => {
    const a = e.target.closest("a[data-file]");
    if (!a) return;
    e.preventDefault();
    const f = a.dataset.file;
    if (location.hash.replace(/^#/, "") === f) loadDoc(f);
    else location.hash = f;
  });
}
init();
</script>
</body>
</html>
